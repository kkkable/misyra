name: misyra-local

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-misyra}
      POSTGRES_USER: ${POSTGRES_USER:-misyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-misyra-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - misyra-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
      - "127.0.0.1:${AZURITE_QUEUE_PORT:-10001}:10001"
      - "127.0.0.1:${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - misyra-azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('node:net');const socket=net.connect(10000,'127.0.0.1',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

volumes:
  misyra-postgres-data:
  misyra-azurite-data:
