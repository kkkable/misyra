# Misyra local development services (MTS-004).
#
# Docker Compose project "misyra-local" provides the deterministic local
# dependencies for API and worker development: PostgreSQL 18 and the Azurite
# Azure Storage emulator. Every value ships a deterministic development
# default and may be overridden through a root .env file (see
# local.env.example). No production credential or cloud dependency exists
# here; state lives in Misyra-owned named volumes only, so resets through
# scripts/dev/reset.mjs can never touch unknown Docker resources.
name: misyra-local

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MISYRA_POSTGRES_USER:-misyra}
      POSTGRES_PASSWORD: ${MISYRA_POSTGRES_PASSWORD:-misyra_local_dev}
      POSTGRES_DB: ${MISYRA_POSTGRES_DB:-misyra}
    ports:
      - "${MISYRA_POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ stores data pg_ctlcluster-style under a major-version
      # subdirectory, so the mount covers /var/lib/postgresql (pg_upgrade ready).
      - misyra-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    restart: unless-stopped
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      - --debug
      - /data/debug.log
    ports:
      - "${MISYRA_AZURITE_BLOB_PORT:-10000}:10000"
      - "${MISYRA_AZURITE_QUEUE_PORT:-10001}:10001"
      - "${MISYRA_AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - misyra-azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

volumes:
  misyra-postgres-data:
  misyra-azurite-data:
