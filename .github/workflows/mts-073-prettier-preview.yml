name: MTS-073 Prettier Preview

on:
  push:
    branches:
      - verify/mts-073-prettier-preview-20260914

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact Prettier rewrite
        run: |
          pnpm exec prettier --write \
            apps/api/src/google-calendar-hidden-events-routes.test.ts \
            apps/api/src/google-calendar-hidden-events.test.ts \
            apps/api/src/google-calendar-routes.ts \
            packages/database/src/google-calendar-hidden-event-store.ts \
            --config packages/config/prettier.config.mjs
          git diff -- \
            apps/api/src/google-calendar-hidden-events-routes.test.ts \
            apps/api/src/google-calendar-hidden-events.test.ts \
            apps/api/src/google-calendar-routes.ts \
            packages/database/src/google-calendar-hidden-event-store.ts

      - name: Commit formatter output on verification branch
        run: |
          if git diff --quiet -- \
            apps/api/src/google-calendar-hidden-events-routes.test.ts \
            apps/api/src/google-calendar-hidden-events.test.ts \
            apps/api/src/google-calendar-routes.ts \
            packages/database/src/google-calendar-hidden-event-store.ts; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git config user.name "Misyra Verification"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/api/src/google-calendar-hidden-events-routes.test.ts \
            apps/api/src/google-calendar-hidden-events.test.ts \
            apps/api/src/google-calendar-routes.ts \
            packages/database/src/google-calendar-hidden-event-store.ts
          git commit -m "chore: materialize MTS-073 formatter output"
          git push origin HEAD:verify/mts-073-prettier-preview-20260914
