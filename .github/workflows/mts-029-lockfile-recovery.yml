name: MTS-029 recovery helper

on:
  push:
    branches:
      - automation/mts-029-lockfile-recovery-20260904t082825z

permissions:
  contents: write

jobs:
  format-target:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-029-local-repositories
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format affected source
        run: pnpm exec prettier --write apps/mobile/src/storage/local-repositories.ts --config packages/config/prettier.config.mjs

      - name: Commit formatting correction to MTS-029 branch
        shell: bash
        run: |
          if git diff --quiet -- apps/mobile/src/storage/local-repositories.ts; then
            echo "Source is already formatted"
            exit 0
          fi
          git config user.name "Misyra Auto Development"
          git config user.email "130823389+kkkable@users.noreply.github.com"
          git add apps/mobile/src/storage/local-repositories.ts
          git commit -m "style(mobile): format local repositories"
          git push origin HEAD:feat/mts-029-local-repositories
