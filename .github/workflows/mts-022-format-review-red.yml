name: MTS-022 format review RED tests

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-format-review-red.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Format review RED tests
        run: pnpm exec prettier --write packages/database/src/tombstone-constraints.review.test.ts packages/database/src/migration-concurrency.review.test.ts --config packages/config/prettier.config.mjs
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/mts-022-format-review-red.yml
          git config user.name "Misyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/src/tombstone-constraints.review.test.ts packages/database/src/migration-concurrency.review.test.ts .github/workflows/mts-022-format-review-red.yml
          git commit -m "style(database): format MTS-022 review RED tests"
          git push origin HEAD:feat/mts-022-postgres-schema
