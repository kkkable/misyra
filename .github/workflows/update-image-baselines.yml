name: Update image baselines (explicit manual workflow)

# Intentionally NOT triggered by push or pull_request: normal CI must stay
# read-only with respect to the committed image baselines (enforced by
# screenshot-generation-contracts.test.mjs). This workflow is the
# deliberate, human/worker-invoked regeneration path on Linux CI: it builds
# the harness APK, boots a deterministic android emulator, runs the explicit
# `visual:update-image-baselines` writer for the web + android namespaces,
# and uploads the regenerated baselines as an artifact. A developer or the
# Implementation Worker then reviews the diff and commits it deliberately.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate MTS-012 image baselines (web + android)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space for the Android build
        shell: bash
        run: |
          # Same runner-disk constraints as the CI emulator job: remove the
          # large pre-installed toolchains this job does not need so the
          # release APK build cannot exhaust the runner disk.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up pnpm (pinned via packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (supplemental web layer)
        run: pnpm exec playwright install chromium

      - name: Build workspace packages (harness bundle prerequisites)
        # The harness APK's Metro bundle resolves the real
        # @misyra/design-tokens and @misyra/localization packages, whose
        # dist output must exist before Gradle bundles the JS.
        run: pnpm build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install emulator and system image
        run: |
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64" "platform-tools"
          yes | sdkmanager --licenses >/dev/null

      - name: Generate the android project (image-harness build)
        run: |
          cd apps/mobile
          MISYRA_HARNESS_BUILD=1 pnpm exec expo prebuild --platform android --no-install

      - name: Point the release bundle at the image-harness entry
        run: node apps/mobile/scripts/prepare-harness-android.mjs

      - name: Build the release APK
        run: |
          cd apps/mobile/android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Regenerate all image baselines on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_9
          avd-name: misyra
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            MISYRA_ANDROID_DEVICE=1 pnpm visual:update-image-baselines

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: image-baselines
          path: tests/mts-012/image-baselines/
          if-no-files-found: error
