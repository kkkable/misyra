name: MTS-101 Prettier Preview

on:
  push:
    branches:
      - verify/mts-101-prettier-preview-20260926

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Print canonical MTS-101 test formatting
        run: pnpm exec prettier packages/localization/src/mts-101-localization.test.ts --config packages/config/prettier.config.mjs
