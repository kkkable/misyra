name: MTS-075 Schema GREEN Preview

on:
  push:
    branches:
      - verify/mts-075-schema-green-20260914

permissions:
  contents: write

jobs:
  schema-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/mts-075-schema-green-20260914

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Add recovery cutoff to canonical Drizzle schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/schema.ts')
          text = path.read_text()
          needle = "    connectionState: text('connection_state').notNull().default('connected'),\n"
          replacement = needle + "    providerCommandCutoffAt: timestamp('provider_command_cutoff_at', { withTimezone: true }),\n"
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one connectionState declaration, found {count}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          pnpm exec prettier --write packages/database/src/schema.ts --config packages/config/prettier.config.mjs

      - name: Commit exact schema result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/database/src/schema.ts; then
            echo "No schema change required."
            exit 0
          fi
          git config user.name "Misyra Verification"
          git config user.email "actions@users.noreply.github.com"
          git add -- packages/database/src/schema.ts
          git commit -m "chore(verify): preview MTS-075 recovery schema"
          git push origin HEAD:verify/mts-075-schema-green-20260914
