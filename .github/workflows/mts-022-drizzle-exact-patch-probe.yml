name: MTS-022 exact Drizzle declaration patch probe

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-drizzle-exact-patch-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install baseline and rc5 in runner only
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @misyra/database add --save-exact --lockfile=false drizzle-orm@1.0.0-rc.5-169397b
      - name: Patch exactly four invalid declaration assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = next(Path('node_modules/.pnpm').glob('drizzle-orm@1.0.0-rc.5-169397b_*/node_modules/drizzle-orm'))
          replacements = {
              root / 'pg-core/policies.d.ts': (
                  'declare class PgPolicy implements PgPolicyConfig {',
                  'declare class PgPolicy {',
              ),
              root / 'pg-core/roles.d.ts': (
                  'declare class PgRole implements PgRoleConfig {',
                  'declare class PgRole {',
              ),
              root / 'cockroach-core/policies.d.ts': (
                  'declare class CockroachPolicy implements CockroachPolicyConfig {',
                  'declare class CockroachPolicy {',
              ),
              root / 'cockroach-core/roles.d.ts': (
                  'declare class CockroachRole implements CockroachRoleConfig {',
                  'declare class CockroachRole {',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r} in {path}, found {count}')
              changed = text.replace(old, new)
              if old in changed or new not in changed:
                  raise SystemExit(f'patch assertion failed for {path}')
              path.write_text(changed)
              print(f'patched {path}')
          PY
      - name: Typecheck database with all strict flags unchanged
        run: pnpm --filter @misyra/database typecheck
      - name: Self-delete probe
        if: always()
        run: |
          git checkout -- packages/database/package.json
          rm .github/workflows/mts-022-drizzle-exact-patch-probe.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-drizzle-exact-patch-probe.yml
          git commit -m 'chore(database): remove exact Drizzle patch probe'
          git push origin HEAD:feat/mts-022-postgres-schema
