name: MTS-077 Prettier Apply

on:
  push:
    branches:
      - verify/mts-077-prettier-preview-20260917t1420z

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MTS-077 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-077-eventkit-mobile-sync
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact formatter output
        shell: bash
        run: |
          pnpm exec prettier packages/database/src/apple-eventkit-sync-store.ts --config packages/config/prettier.config.mjs --write
          if git diff --quiet -- packages/database/src/apple-eventkit-sync-store.ts; then
            echo "No formatter change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/apple-eventkit-sync-store.ts
          git commit -m "MTS-077: apply exact Prettier output"
          git push origin HEAD:feat/mts-077-eventkit-mobile-sync
