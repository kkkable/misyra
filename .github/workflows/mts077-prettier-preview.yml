name: MTS-077 Provider Deletion Snapshot Apply

on:
  push:
    branches:
      - verify/mts-077-prettier-preview-20260917t1420z

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MTS-077 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-077-eventkit-mobile-sync
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply provider deletion snapshot fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/sync/apple-calendar-mobile-sync.ts')
          source = path.read_text()

          replacements = [
              (
                  "type LinkedProviderEvent = ProviderLink & Readonly<{ providerEventId: string }>;",
                  """type LinkedProviderEvent = ProviderLink &
            Readonly<{
              providerEventId: string;
              completionState: 'incomplete' | 'completed';
              serverVersion: number | null;
            }>;""",
              ),
              (
                  """      const mission = await store.getMissionSyncState(link.occurrenceId);
                if (mission?.completionState === 'completed') {
                  frozenProviderEvents += 1;
                  continue;
                }
                if (mission === null || mission.serverVersion === null) continue;""",
                  """      if (link.completionState === 'completed') {
                  frozenProviderEvents += 1;
                  continue;
                }
                if (link.serverVersion === null) continue;""",
              ),
              (
                  "        baseVersion: mission.serverVersion,\n      });\n      providerChangesQueued += 1;\n    }\n\n    return {",
                  "        baseVersion: link.serverVersion,\n      });\n      providerChangesQueued += 1;\n    }\n\n    return {",
              ),
              (
                  """type LinkedWindowRow = Readonly<{
            occurrence_id: string;
            series_id: string;
            external_event_id: string;
            link_payload_json: string;
            occurrence_payload_json: string;
          }>;""",
                  """type LinkedWindowRow = Readonly<{
            occurrence_id: string;
            series_id: string;
            external_event_id: string;
            link_payload_json: string;
            occurrence_payload_json: string;
            server_version: number | null;
          }>;""",
              ),
              (
                  "              o.payload_json AS occurrence_payload_json\n         FROM external_links l",
                  "              o.payload_json AS occurrence_payload_json,\n              o.server_version\n         FROM external_links l",
              ),
              (
                  """          providerEventId: row.external_event_id,
                    providerCalendarId: payload.providerCalendarId,
                    connectionId: payload.connectionId,
                    ownership: payload.ownership,""",
                  """          providerEventId: row.external_event_id,
                    providerCalendarId: payload.providerCalendarId,
                    connectionId: payload.connectionId,
                    ownership: payload.ownership,
                    completionState: occurrence.completionState,
                    serverVersion: row.server_version,""",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch target, found {count}: {old[:80]!r}')
              source = source.replace(old, new)

          path.write_text(source)
          PY
          pnpm exec prettier apps/mobile/src/sync/apple-calendar-mobile-sync.ts --config packages/config/prettier.config.mjs --write
          pnpm exec prettier apps/mobile/src/sync/apple-calendar-mobile-sync.ts --config packages/config/prettier.config.mjs --check
          pnpm --filter @misyra/mobile lint
          pnpm --filter @misyra/mobile typecheck
          pnpm --filter @misyra/mobile exec vitest run --config ../../packages/config/vitest.config.mjs src/sync/apple-calendar-provider-deletion.test.mjs src/sync/apple-calendar-mobile-sync-store.test.mjs src/sync/apple-calendar-mobile-sync.test.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/sync/apple-calendar-mobile-sync.ts
          git commit -m "MTS-077: preserve linked deletion snapshot state"
          git push origin HEAD:feat/mts-077-eventkit-mobile-sync
