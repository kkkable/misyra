name: MTS-077 Lint Correction Apply

on:
  push:
    branches:
      - verify/mts-077-prettier-preview-20260917t1420z

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MTS-077 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-077-eventkit-mobile-sync
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact lint correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/apple-eventkit-sync-store.ts')
          source = path.read_text()
          old = "): Promise<Readonly<{ operation: 'upsert' | 'delete'; payload: unknown | null }>> {"
          new = "): Promise<Readonly<{ operation: 'upsert' | 'delete'; payload: unknown }>> {"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one lint target, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          pnpm exec prettier packages/database/src/apple-eventkit-sync-store.ts --config packages/config/prettier.config.mjs --check
          pnpm --filter @misyra/database lint
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/apple-eventkit-sync-store.ts
          git commit -m "MTS-077: correct deletion projection return type"
          git push origin HEAD:feat/mts-077-eventkit-mobile-sync
