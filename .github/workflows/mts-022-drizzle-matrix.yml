name: MTS-022 Drizzle compatibility matrix

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-drizzle-matrix.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install baseline
        run: pnpm install --frozen-lockfile
      - name: Probe Drizzle versions with repository TypeScript 6 strict config
        shell: bash
        run: |
          set +e
          passed=''
          for version in 1.0.0-rc.5-169397b 0.44.7 0.43.1 0.42.0; do
            echo "=== PROBE $version ==="
            git checkout -- packages/database/package.json
            pnpm --filter @misyra/database add --save-exact --lockfile=false "drizzle-orm@$version"
            pnpm --filter @misyra/database typecheck
            status=$?
            echo "=== RESULT $version status=$status ==="
            if [ "$status" -eq 0 ]; then
              passed="$version"
              break
            fi
          done
          git checkout -- packages/database/package.json
          if [ -z "$passed" ]; then
            echo 'NO_COMPATIBLE_VERSION'
            exit 1
          fi
          echo "COMPATIBLE_VERSION=$passed"
      - name: Self-delete probe
        if: always()
        run: |
          rm .github/workflows/mts-022-drizzle-matrix.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-drizzle-matrix.yml
          git commit -m 'chore(database): remove Drizzle compatibility probe'
          git push origin HEAD:feat/mts-022-postgres-schema
