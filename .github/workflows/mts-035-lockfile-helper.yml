name: MTS-035 lockfile helper

on:
  push:
    branches:
      - verify/mts-035-lockfile-20260905

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active ticket branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-035-mobile-provider-signin
          persist-credentials: true
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact merged lockfile
        run: pnpm install --frozen-lockfile
      - name: Format resumed MTS-035 test
        run: pnpm exec prettier --write apps/mobile/src/auth/sign-in-screen.test.mjs --config packages/config/prettier.config.mjs
      - name: Commit formatting to active ticket branch
        run: |
          git config user.name "Misyra Auto Development"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/src/auth/sign-in-screen.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(mts-035): format sign-in screen test"
            git push origin HEAD:feat/mts-035-mobile-provider-signin
          fi
      - name: Verify focused mobile auth baseline
        run: |
          pnpm --filter @misyra/mobile format
          pnpm --filter @misyra/mobile lint
          pnpm --filter @misyra/mobile typecheck
          pnpm --filter @misyra/mobile test -- auth
