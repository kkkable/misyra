name: MTS-035 lockfile helper

on:
  push:
    branches:
      - verify/mts-035-lockfile-20260905

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active ticket branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-035-mobile-provider-signin
          persist-credentials: true
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Regenerate merged lockfile
        run: pnpm install --lockfile-only
      - name: Commit merged lockfile to active ticket branch
        run: |
          git config user.name "Misyra Auto Development"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(mts-035): reconcile merged lockfile"
          git push origin HEAD:feat/mts-035-mobile-provider-signin
      - name: Verify frozen install and focused mobile auth checks
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @misyra/mobile format
          pnpm --filter @misyra/mobile lint
          pnpm --filter @misyra/mobile typecheck
          pnpm --filter @misyra/mobile test -- auth
