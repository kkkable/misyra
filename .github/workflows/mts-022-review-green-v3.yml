name: MTS-022 review GREEN v3

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-review-green-v3.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - name: Apply bounded database corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('packages/database/migrations/0000_core.sql')
          text = path.read_text()
          text = one(text, 'CREATE INDEX mission_series_account_idx ON mission_series(account_id);\n', 'CREATE INDEX mission_series_account_idx ON mission_series(account_id);\nCREATE UNIQUE INDEX mission_series_id_account_uidx ON mission_series(id, account_id);\n', 'series tenant key')
          text = one(text, '  series_id uuid NOT NULL REFERENCES mission_series(id) ON DELETE RESTRICT,\n', '  series_id uuid NOT NULL,\n', 'series inline fk')
          text = one(text, '  CONSTRAINT mission_occurrences_effort_check CHECK ((all_day = false AND estimated_effort_minutes IS NULL) OR (all_day = true AND estimated_effort_minutes > 0)),\n  created_at timestamptz NOT NULL DEFAULT now(),\n', '  CONSTRAINT mission_occurrences_effort_check CHECK ((all_day = false AND estimated_effort_minutes IS NULL) OR (all_day = true AND estimated_effort_minutes > 0)),\n  CONSTRAINT mission_occurrences_series_account_fk FOREIGN KEY (series_id, account_id) REFERENCES mission_series(id, account_id) ON DELETE RESTRICT,\n  created_at timestamptz NOT NULL DEFAULT now(),\n', 'occurrence tenant fk')
          text = one(text, 'CREATE INDEX mission_occurrences_series_idx ON mission_occurrences(series_id);\n', 'CREATE INDEX mission_occurrences_series_idx ON mission_occurrences(series_id);\nCREATE UNIQUE INDEX mission_occurrences_id_account_uidx ON mission_occurrences(id, account_id);\n', 'occurrence tenant key')
          text = one(text, 'CREATE TABLE mission_personal_notes (\n  occurrence_id uuid PRIMARY KEY REFERENCES mission_occurrences(id) ON DELETE CASCADE,\n  account_id uuid NOT NULL REFERENCES accounts(id) ON DELETE CASCADE,\n  note text NOT NULL,\n  updated_at timestamptz NOT NULL DEFAULT now()\n);', 'CREATE TABLE mission_personal_notes (\n  occurrence_id uuid PRIMARY KEY,\n  account_id uuid NOT NULL REFERENCES accounts(id) ON DELETE CASCADE,\n  note text NOT NULL,\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT mission_personal_notes_occurrence_account_fk FOREIGN KEY (occurrence_id, account_id) REFERENCES mission_occurrences(id, account_id) ON DELETE CASCADE\n);', 'note tenant fk')
          text = one(text, '  occurrence_id uuid NOT NULL REFERENCES mission_occurrences(id) ON DELETE CASCADE,\n  completion_type text NOT NULL,\n  action_time timestamptz NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT mission_completions_occurrence_unique UNIQUE (occurrence_id)\n', '  occurrence_id uuid NOT NULL,\n  completion_type text NOT NULL,\n  action_time timestamptz NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT mission_completions_occurrence_account_fk FOREIGN KEY (occurrence_id, account_id) REFERENCES mission_occurrences(id, account_id) ON DELETE CASCADE,\n  CONSTRAINT mission_completions_occurrence_unique UNIQUE (occurrence_id)\n', 'completion tenant fk')
          text = one(text, '  occurrence_id uuid NOT NULL REFERENCES mission_occurrences(id) ON DELETE CASCADE,\n  attempt_number smallint NOT NULL,\n  status text NOT NULL,\n  submitted_at timestamptz,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT evidence_attempts_number_check CHECK (attempt_number BETWEEN 1 AND 3),\n', '  occurrence_id uuid NOT NULL,\n  attempt_number smallint NOT NULL,\n  status text NOT NULL,\n  submitted_at timestamptz,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT evidence_attempts_occurrence_account_fk FOREIGN KEY (occurrence_id, account_id) REFERENCES mission_occurrences(id, account_id) ON DELETE CASCADE,\n  CONSTRAINT evidence_attempts_number_check CHECK (attempt_number BETWEEN 1 AND 3),\n', 'evidence tenant fk')
          text = one(text, "  occurrence_id uuid NOT NULL REFERENCES mission_occurrences(id) ON DELETE CASCADE,\n  state text NOT NULL DEFAULT 'active',\n  ai_generation_count smallint NOT NULL DEFAULT 0,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT story_drafts_ai_generation_count_check CHECK (ai_generation_count BETWEEN 0 AND 3)\n", "  occurrence_id uuid NOT NULL,\n  state text NOT NULL DEFAULT 'active',\n  ai_generation_count smallint NOT NULL DEFAULT 0,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT story_drafts_occurrence_account_fk FOREIGN KEY (occurrence_id, account_id) REFERENCES mission_occurrences(id, account_id) ON DELETE CASCADE,\n  CONSTRAINT story_drafts_ai_generation_count_check CHECK (ai_generation_count BETWEEN 0 AND 3)\n", 'story tenant fk')
          guard = "CREATE OR REPLACE FUNCTION misyra_protect_completion_identity()\nRETURNS trigger\nLANGUAGE plpgsql\nAS $$\nBEGIN\n  IF TG_OP = 'UPDATE' THEN\n    IF NEW.occurrence_id IS DISTINCT FROM OLD.occurrence_id\n       OR NEW.account_id IS DISTINCT FROM OLD.account_id THEN\n      RAISE EXCEPTION 'Completion identity is immutable';\n    END IF;\n    RETURN NEW;\n  END IF;\n\n  IF EXISTS (SELECT 1 FROM mission_occurrences WHERE id = OLD.occurrence_id) THEN\n    RAISE EXCEPTION 'Completion cannot be deleted while its occurrence exists';\n  END IF;\n  RETURN OLD;\nEND;\n$$;\n\nCREATE TRIGGER mission_completions_identity_immutable\nBEFORE UPDATE OR DELETE ON mission_completions\nFOR EACH ROW\nEXECUTE FUNCTION misyra_protect_completion_identity();\n\n"
          text = one(text, 'CREATE OR REPLACE FUNCTION misyra_protect_completed_occurrence()\n', guard + 'CREATE OR REPLACE FUNCTION misyra_protect_completed_occurrence()\n', 'completion guard')
          path.write_text(text)

          path = Path('packages/database/src/migrations.ts')
          text = path.read_text()
          text = one(text, "const migrationDirectory = fileURLToPath(new URL('../migrations/', import.meta.url));\n", "const migrationDirectory = fileURLToPath(new URL('../migrations/', import.meta.url));\nconst migrationAdvisoryLockKey = 1296651097;\n", 'migration lock constant')
          text = one(text, "  try {\n    await client.query('CREATE SCHEMA IF NOT EXISTS misyra_meta');\n", "  try {\n    await client.query('SELECT pg_advisory_lock($1)', [migrationAdvisoryLockKey]);\n    await client.query('CREATE SCHEMA IF NOT EXISTS misyra_meta');\n", 'migration lock')
          path.write_text(text)

          path = Path('packages/database/src/schema.ts')
          text = path.read_text()
          text = one(text, '  date,\n  index,\n', '  date,\n  foreignKey,\n  index,\n', 'foreignKey import')
          text = one(text, "  (table) => [index('mission_series_account_idx').on(table.accountId)],\n);\n\nexport const missionOccurrences", "  (table) => [\n    index('mission_series_account_idx').on(table.accountId),\n    uniqueIndex('mission_series_id_account_uidx').on(table.id, table.accountId),\n  ],\n);\n\nexport const missionOccurrences", 'series schema tenant key')
          text = one(text, "    seriesId: uuid('series_id')\n      .notNull()\n      .references(() => missionSeries.id, { onDelete: 'restrict' }),\n", "    seriesId: uuid('series_id').notNull(),\n", 'series schema inline fk')
          text = one(text, "    index('mission_occurrences_account_date_idx').on(table.accountId, table.localDate),\n    index('mission_occurrences_series_idx').on(table.seriesId),\n", "    index('mission_occurrences_account_date_idx').on(table.accountId, table.localDate),\n    index('mission_occurrences_series_idx').on(table.seriesId),\n    uniqueIndex('mission_occurrences_id_account_uidx').on(table.id, table.accountId),\n    foreignKey({ columns: [table.seriesId, table.accountId], foreignColumns: [missionSeries.id, missionSeries.accountId], name: 'mission_occurrences_series_account_fk' }).onDelete('restrict'),\n", 'occurrence schema tenant fk')
          text = one(text, "    occurrenceId: uuid('occurrence_id')\n      .primaryKey()\n      .references(() => missionOccurrences.id, { onDelete: 'cascade' }),\n", "    occurrenceId: uuid('occurrence_id').primaryKey(),\n", 'note schema occurrence')
          text = one(text, "  (table) => [index('mission_personal_notes_account_idx').on(table.accountId)],\n);", "  (table) => [\n    index('mission_personal_notes_account_idx').on(table.accountId),\n    foreignKey({ columns: [table.occurrenceId, table.accountId], foreignColumns: [missionOccurrences.id, missionOccurrences.accountId], name: 'mission_personal_notes_occurrence_account_fk' }).onDelete('cascade'),\n  ],\n);", 'note schema tenant fk')
          text = one(text, "    occurrenceId: uuid('occurrence_id')\n      .notNull()\n      .references(() => missionOccurrences.id, { onDelete: 'cascade' }),\n    completionType: text('completion_type').notNull(),\n", "    occurrenceId: uuid('occurrence_id').notNull(),\n    completionType: text('completion_type').notNull(),\n", 'completion schema occurrence')
          text = one(text, "    uniqueIndex('mission_completions_occurrence_uidx').on(table.occurrenceId),\n    index('mission_completions_account_idx').on(table.accountId),\n", "    uniqueIndex('mission_completions_occurrence_uidx').on(table.occurrenceId),\n    index('mission_completions_account_idx').on(table.accountId),\n    foreignKey({ columns: [table.occurrenceId, table.accountId], foreignColumns: [missionOccurrences.id, missionOccurrences.accountId], name: 'mission_completions_occurrence_account_fk' }).onDelete('cascade'),\n", 'completion schema tenant fk')
          text = one(text, "    occurrenceId: uuid('occurrence_id')\n      .notNull()\n      .references(() => missionOccurrences.id, { onDelete: 'cascade' }),\n    attemptNumber: smallint('attempt_number').notNull(),\n", "    occurrenceId: uuid('occurrence_id').notNull(),\n    attemptNumber: smallint('attempt_number').notNull(),\n", 'evidence schema occurrence')
          text = one(text, "    index('evidence_attempts_account_idx').on(table.accountId),\n    check('evidence_attempts_number_check', sql`${table.attemptNumber} between 1 and 3`),\n", "    index('evidence_attempts_account_idx').on(table.accountId),\n    foreignKey({ columns: [table.occurrenceId, table.accountId], foreignColumns: [missionOccurrences.id, missionOccurrences.accountId], name: 'evidence_attempts_occurrence_account_fk' }).onDelete('cascade'),\n    check('evidence_attempts_number_check', sql`${table.attemptNumber} between 1 and 3`),\n", 'evidence schema tenant fk')
          text = one(text, "    occurrenceId: uuid('occurrence_id')\n      .notNull()\n      .references(() => missionOccurrences.id, { onDelete: 'cascade' }),\n    state: text('state').notNull().default('active'),\n", "    occurrenceId: uuid('occurrence_id').notNull(),\n    state: text('state').notNull().default('active'),\n", 'story schema occurrence')
          text = one(text, "    index('story_drafts_account_idx').on(table.accountId),\n    check(\n", "    index('story_drafts_account_idx').on(table.accountId),\n    foreignKey({ columns: [table.occurrenceId, table.accountId], foreignColumns: [missionOccurrences.id, missionOccurrences.accountId], name: 'story_drafts_occurrence_account_fk' }).onDelete('cascade'),\n    check(\n", 'story schema tenant fk')
          path.write_text(text)
          PY
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Format corrected TypeScript
        run: pnpm exec prettier --write packages/database/src/migrations.ts packages/database/src/schema.ts --config packages/config/prettier.config.mjs
      - name: Commit implementation corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Misyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/migrations/0000_core.sql packages/database/src/migrations.ts packages/database/src/schema.ts
          git commit -m "fix(database): enforce tenant integrity and migration serialization"
          git push origin HEAD:feat/mts-022-postgres-schema
