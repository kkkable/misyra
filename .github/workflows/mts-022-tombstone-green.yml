name: MTS-022 permanent tombstone GREEN

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-tombstone-green.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - name: Enforce tombstone identity and resurrection boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/database/migrations/0000_core.sql')
          text = path.read_text()
          old = """CREATE OR REPLACE FUNCTION misyra_protect_occurrence_tombstone()
RETURNS trigger
LANGUAGE plpgsql
AS $$
BEGIN
  IF EXISTS (SELECT 1 FROM accounts WHERE id = OLD.account_id) THEN
    RAISE EXCEPTION 'Occurrence tombstones are permanent while the account exists';
  END IF;
  RETURN OLD;
END;
$$;

CREATE TRIGGER mission_occurrence_tombstones_permanent
BEFORE DELETE ON mission_occurrence_tombstones
FOR EACH ROW
EXECUTE FUNCTION misyra_protect_occurrence_tombstone();

CREATE OR REPLACE FUNCTION misyra_protect_completed_occurrence()
"""
          new = """CREATE OR REPLACE FUNCTION misyra_protect_occurrence_tombstone()
RETURNS trigger
LANGUAGE plpgsql
AS $$
BEGIN
  IF TG_OP = 'UPDATE' THEN
    IF NEW.occurrence_id IS DISTINCT FROM OLD.occurrence_id
       OR NEW.account_id IS DISTINCT FROM OLD.account_id THEN
      RAISE EXCEPTION 'Occurrence tombstone identity is permanent and immutable';
    END IF;
    RETURN NEW;
  END IF;

  IF EXISTS (SELECT 1 FROM accounts WHERE id = OLD.account_id) THEN
    RAISE EXCEPTION 'Occurrence tombstones are permanent while the account exists';
  END IF;
  RETURN OLD;
END;
$$;

CREATE TRIGGER mission_occurrence_tombstones_permanent
BEFORE UPDATE OR DELETE ON mission_occurrence_tombstones
FOR EACH ROW
EXECUTE FUNCTION misyra_protect_occurrence_tombstone();

CREATE OR REPLACE FUNCTION misyra_reject_tombstoned_occurrence()
RETURNS trigger
LANGUAGE plpgsql
AS $$
BEGIN
  IF EXISTS (
    SELECT 1
    FROM mission_occurrence_tombstones
    WHERE occurrence_id = NEW.id
  ) THEN
    RAISE EXCEPTION 'Tombstoned occurrence ids cannot be resurrected';
  END IF;
  RETURN NEW;
END;
$$;

CREATE TRIGGER mission_occurrences_reject_tombstoned_id
BEFORE INSERT OR UPDATE ON mission_occurrences
FOR EACH ROW
EXECUTE FUNCTION misyra_reject_tombstoned_occurrence();

CREATE OR REPLACE FUNCTION misyra_protect_completed_occurrence()
"""
          if text.count(old) != 1:
              raise SystemExit('unexpected tombstone trigger source shape')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit GREEN and remove helper
        shell: bash
        run: |
          rm .github/workflows/mts-022-tombstone-green.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/database/migrations/0000_core.sql .github/workflows/mts-022-tombstone-green.yml
          git diff --cached --check
          git commit -m 'fix(database): enforce permanent occurrence tombstones'
          git push origin HEAD:feat/mts-022-postgres-schema
      - name: Remove helper after failed correction
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          rm -f .github/workflows/mts-022-tombstone-green.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-tombstone-green.yml
          git diff --cached --quiet || git commit -m 'chore(database): remove failed tombstone helper'
          git push origin HEAD:feat/mts-022-postgres-schema
