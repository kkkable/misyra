# Disposable verification workflow; never merge into main.
name: MTS-037 format extract

on:
  push:
    branches:
      - verify/mts-037-format-extract-20260905t1555z

permissions:
  contents: write

jobs:
  format-extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Materialize exact Prettier output on disposable branch
        shell: bash
        run: |
          pnpm --filter @misyra/api exec prettier --write src/account-lifecycle.ts src/application.ts --config ../../packages/config/prettier.config.mjs
          git config user.name "Misyra Verification Helper"
          git config user.email "130823389+kkkable@users.noreply.github.com"
          git add apps/api/src/account-lifecycle.ts apps/api/src/application.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "chore(verify): materialize exact MTS-037 prettier output [skip ci]"
            git push origin HEAD:verify/mts-037-format-extract-20260905t1555z
          fi
