name: Disposable MTS-034 cleanup and verification

on:
  push:
    branches:
      - automation/mts034-clean-verify-20260905

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-corrections-025-034
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Format latest remediation edits
        run: |
          pnpm exec prettier --write apps/mobile/src/search/offline-search.ts apps/mobile/src/search/offline-search.test.mjs apps/api/src/application.ts apps/api/src/application.test.ts --config packages/config/prettier.config.mjs
          if ! git diff --quiet; then
            git config user.name "Misyra Auto Development"
            git config user.email "actions@users.noreply.github.com"
            git add apps/mobile/src/search/offline-search.ts apps/mobile/src/search/offline-search.test.mjs apps/api/src/application.ts apps/api/src/application.test.ts
            git commit -m "style: format final audit remediation fixes"
            git push origin HEAD:fix/audit-corrections-025-034
          fi

      - name: Verify focused remediation files
        run: |
          pnpm exec prettier --check apps/mobile/src/search/offline-search.ts apps/mobile/src/search/offline-search.test.mjs apps/api/src/application.ts apps/api/src/application.test.ts --config packages/config/prettier.config.mjs
          pnpm --filter @misyra/mobile typecheck
          pnpm --filter @misyra/mobile lint
          pnpm --filter @misyra/mobile test -- offline-search.test.mjs
          pnpm --filter @misyra/api typecheck
          pnpm --filter @misyra/api lint
          pnpm --filter @misyra/api test -- application.test.ts
