name: Recover authoritative product specification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-product-spec.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact specification and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git checkout db06c036a2e8bd9dc5ee21843c958e4910aaac95 -- docs/specifications/product-specification.md
          rm .github/workflows/recover-product-spec.yml
          git config user.name "Misyra Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add docs/specifications/product-specification.md .github/workflows/recover-product-spec.yml
          git commit -m "chore: restore authoritative product specification"
          git push origin HEAD:main
