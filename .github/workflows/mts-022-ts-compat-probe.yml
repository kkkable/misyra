name: MTS-022 TypeScript compatibility probe

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-ts-compat-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck database with TypeScript 5.9 strict config
        run: pnpm dlx --package=typescript@5.9.3 tsc --project packages/database/tsconfig.json --noEmit
      - name: Self-delete probe
        if: always()
        run: |
          rm .github/workflows/mts-022-ts-compat-probe.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-ts-compat-probe.yml
          git commit -m 'chore(database): remove TypeScript compatibility probe'
          git push origin HEAD:feat/mts-022-postgres-schema
