name: Disposable MTS-025 schema parity verification

on:
  push:
    branches:
      - automation/mts025-schema-parity-20260905

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-corrections-025-034
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start repository PostgreSQL
        run: docker compose up -d postgres

      - name: Verify exact correction head
        env:
          POSTGRES_USER: misyra
          POSTGRES_PASSWORD: misyra-local-only
          POSTGRES_PORT: '5432'
        run: |
          test "$(git rev-parse HEAD)" = "e31794c194deeb63405faeade56c23860de23c84"
          pnpm exec prettier --check packages/database/src/schema.ts packages/database/src/schema.test.ts --config packages/config/prettier.config.mjs
          pnpm --filter @misyra/database typecheck
          pnpm --filter @misyra/database lint
          pnpm --filter @misyra/database test
