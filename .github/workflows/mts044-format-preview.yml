name: MTS-044 narrow correction helper

on:
  push:
    branches:
      - verify/mts-044-format-20260906t1824z

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-044-two-tap-creation
          fetch-depth: 0
      - name: Preserve validated reward eligibility during placement validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/src/calendar/calendar-mission-create.ts')
          text = path.read_text()
          old = "    currentRewardEligibility: 'undetermined',\n"
          new = "    currentRewardEligibility: input.rewardEligibility,\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one reward input, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify diff is confined and commit to active branch
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "apps/mobile/src/calendar/calendar-mission-create.ts "
          git diff -- apps/mobile/src/calendar/calendar-mission-create.ts
          git config user.name "Misyra Auto Development"
          git config user.email "130823389+kkkable@users.noreply.github.com"
          git add apps/mobile/src/calendar/calendar-mission-create.ts
          git commit -m "fix: preserve Calendar create reward eligibility"
          git push origin HEAD:feat/mts-044-two-tap-creation
