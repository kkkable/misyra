name: MTS-044 narrow correction helper

on:
  push:
    branches:
      - verify/mts-044-format-20260906t1824z

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-044-two-tap-creation
          fetch-depth: 0
      - name: Replace only the invalid type import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/src/calendar/calendar-day-screen.tsx')
          text = path.read_text()
          old = """import {\n  CalendarInteractiveTimeline,\n  type CalendarMissionCreateInput,\n} from './calendar-interactive-timeline.js';\n"""
          new = """import { CalendarInteractiveTimeline } from './calendar-interactive-timeline.js';\nimport type { CalendarMissionCreateInput } from './calendar-mission-create.js';\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify diff is confined and commit to active branch
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "apps/mobile/src/calendar/calendar-day-screen.tsx "
          git diff -- apps/mobile/src/calendar/calendar-day-screen.tsx
          git config user.name "Misyra Auto Development"
          git config user.email "130823389+kkkable@users.noreply.github.com"
          git add apps/mobile/src/calendar/calendar-day-screen.tsx
          git commit -m "fix: import Calendar create input from defining module"
          git push origin HEAD:feat/mts-044-two-tap-creation
