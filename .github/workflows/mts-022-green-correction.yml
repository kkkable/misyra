name: MTS-022 GREEN correction

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-green-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - name: Apply validated schema corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path('packages/database/src/schema.ts')
          schema = schema_path.read_text()

          replacements = [
              (
                  "  (table) => [index('account_sessions_account_idx').on(table.accountId)],\n);",
                  "  (table) => [\n    index('account_sessions_account_idx').on(table.accountId),\n    uniqueIndex('account_sessions_refresh_hash_uidx').on(table.refreshTokenHash),\n  ],\n);",
              ),
              (
                  "    seriesId: uuid('series_id').references(() => missionSeries.id, { onDelete: 'set null' }),\n    localDate: date('local_date').notNull(),\n    localStart: text('local_start'),\n    localFinish: text('local_finish'),\n    startInstant: timestamp('start_instant', { withTimezone: true }),\n    finishInstant: timestamp('finish_instant', { withTimezone: true }),\n    timeZone: text('time_zone').notNull(),\n    allDay: boolean('all_day').notNull().default(false),\n    location: text('location'),\n    notes: text('notes'),\n    version: integer('version').notNull().default(1),",
                  "    seriesId: uuid('series_id')\n      .notNull()\n      .references(() => missionSeries.id, { onDelete: 'restrict' }),\n    localDate: date('local_date').notNull(),\n    localStart: text('local_start').notNull(),\n    localFinish: text('local_finish').notNull(),\n    startInstant: timestamp('start_instant', { withTimezone: true }).notNull(),\n    finishInstant: timestamp('finish_instant', { withTimezone: true }).notNull(),\n    timeZone: text('time_zone').notNull(),\n    timeBehavior: text('time_behavior').notNull(),\n    allDay: boolean('all_day').notNull().default(false),\n    estimatedEffortMinutes: integer('estimated_effort_minutes'),\n    scheduleState: text('schedule_state').notNull().default('scheduled'),\n    completionState: text('completion_state').notNull().default('incomplete'),\n    evidenceState: text('evidence_state').notNull().default('not_submitted'),\n    rewardEligibility: text('reward_eligibility').notNull().default('undetermined'),\n    rewardIssuance: text('reward_issuance').notNull().default('not_issued'),\n    calendarSource: text('calendar_source').notNull().default('internal'),\n    fieldOwnership: text('field_ownership').notNull().default('app_owned'),\n    synchronizationState: text('synchronization_state').notNull().default('local_only'),\n    storyState: text('story_state').notNull().default('none'),\n    deletionState: text('deletion_state').notNull().default('active'),\n    location: text('location'),\n    notes: text('notes'),\n    version: integer('version').notNull().default(1),",
              ),
              (
                  "  (table) => [\n    index('mission_occurrences_account_date_idx').on(table.accountId, table.localDate),\n    index('mission_occurrences_series_idx').on(table.seriesId),\n  ],\n);",
                  "  (table) => [\n    index('mission_occurrences_account_date_idx').on(table.accountId, table.localDate),\n    index('mission_occurrences_series_idx').on(table.seriesId),\n    check(\n      'mission_occurrences_time_behavior_check',\n      sql`${table.timeBehavior} in ('local_time', 'fixed_instant')`,\n    ),\n    check(\n      'mission_occurrences_schedule_state_check',\n      sql`${table.scheduleState} in ('scheduled', 'cancelled')`,\n    ),\n    check(\n      'mission_occurrences_completion_state_check',\n      sql`${table.completionState} in ('incomplete', 'completed')`,\n    ),\n    check(\n      'mission_occurrences_evidence_state_check',\n      sql`${table.evidenceState} in ('not_submitted', 'pending', 'accepted', 'rejected', 'not_required')`,\n    ),\n    check(\n      'mission_occurrences_reward_eligibility_check',\n      sql`${table.rewardEligibility} in ('undetermined', 'eligible', 'ineligible')`,\n    ),\n    check(\n      'mission_occurrences_reward_issuance_check',\n      sql`${table.rewardIssuance} in ('not_issued', 'issued')`,\n    ),\n    check(\n      'mission_occurrences_calendar_source_check',\n      sql`${table.calendarSource} in ('internal', 'external')`,\n    ),\n    check(\n      'mission_occurrences_field_ownership_check',\n      sql`${table.fieldOwnership} in ('app_owned', 'organizer_controlled')`,\n    ),\n    check(\n      'mission_occurrences_synchronization_state_check',\n      sql`${table.synchronizationState} in ('local_only', 'pending', 'synced', 'failed')`,\n    ),\n    check(\n      'mission_occurrences_story_state_check',\n      sql`${table.storyState} in ('none', 'draft', 'ready')`,\n    ),\n    check(\n      'mission_occurrences_deletion_state_check',\n      sql`${table.deletionState} in ('active', 'deleted')`,\n    ),\n    check(\n      'mission_occurrences_finish_after_start_check',\n      sql`${table.finishInstant} > ${table.startInstant}`,\n    ),\n    check('mission_occurrences_version_check', sql`${table.version} > 0`),\n    check(\n      'mission_occurrences_effort_check',\n      sql`(${table.allDay} = false and ${table.estimatedEffortMinutes} is null) or (${table.allDay} = true and ${table.estimatedEffortMinutes} > 0)`,\n    ),\n  ],\n);",
              ),
              (
                  "    occurrenceId: uuid('occurrence_id')\n      .notNull()\n      .references(() => missionOccurrences.id, { onDelete: 'cascade' }),\n    baseXp: integer('base_xp').notNull(),",
                  "    occurrenceId: uuid('occurrence_id').notNull(),\n    baseXp: integer('base_xp').notNull(),",
              ),
          ]

          for old, new in replacements:
              if schema.count(old) != 1:
                  raise SystemExit(f'Unexpected schema source shape for replacement: {old[:120]!r}')
              schema = schema.replace(old, new)
          schema_path.write_text(schema)

          sql_path = Path('packages/database/migrations/0000_core.sql')
          migration = sql_path.read_text()
          sql_replacements = [
              (
                  "  series_id uuid REFERENCES mission_series(id) ON DELETE SET NULL,\n  local_date date NOT NULL,\n  local_start text,\n  local_finish text,\n  start_instant timestamptz,\n  finish_instant timestamptz,\n  time_zone text NOT NULL,\n  all_day boolean NOT NULL DEFAULT false,\n  location text,\n  notes text,\n  version integer NOT NULL DEFAULT 1,",
                  "  series_id uuid NOT NULL REFERENCES mission_series(id) ON DELETE RESTRICT,\n  local_date date NOT NULL,\n  local_start text NOT NULL,\n  local_finish text NOT NULL,\n  start_instant timestamptz NOT NULL,\n  finish_instant timestamptz NOT NULL,\n  time_zone text NOT NULL,\n  time_behavior text NOT NULL,\n  all_day boolean NOT NULL DEFAULT false,\n  estimated_effort_minutes integer,\n  schedule_state text NOT NULL DEFAULT 'scheduled',\n  completion_state text NOT NULL DEFAULT 'incomplete',\n  evidence_state text NOT NULL DEFAULT 'not_submitted',\n  reward_eligibility text NOT NULL DEFAULT 'undetermined',\n  reward_issuance text NOT NULL DEFAULT 'not_issued',\n  calendar_source text NOT NULL DEFAULT 'internal',\n  field_ownership text NOT NULL DEFAULT 'app_owned',\n  synchronization_state text NOT NULL DEFAULT 'local_only',\n  story_state text NOT NULL DEFAULT 'none',\n  deletion_state text NOT NULL DEFAULT 'active',\n  location text,\n  notes text,\n  version integer NOT NULL DEFAULT 1,\n  CONSTRAINT mission_occurrences_time_behavior_check CHECK (time_behavior IN ('local_time', 'fixed_instant')),\n  CONSTRAINT mission_occurrences_schedule_state_check CHECK (schedule_state IN ('scheduled', 'cancelled')),\n  CONSTRAINT mission_occurrences_completion_state_check CHECK (completion_state IN ('incomplete', 'completed')),\n  CONSTRAINT mission_occurrences_evidence_state_check CHECK (evidence_state IN ('not_submitted', 'pending', 'accepted', 'rejected', 'not_required')),\n  CONSTRAINT mission_occurrences_reward_eligibility_check CHECK (reward_eligibility IN ('undetermined', 'eligible', 'ineligible')),\n  CONSTRAINT mission_occurrences_reward_issuance_check CHECK (reward_issuance IN ('not_issued', 'issued')),\n  CONSTRAINT mission_occurrences_calendar_source_check CHECK (calendar_source IN ('internal', 'external')),\n  CONSTRAINT mission_occurrences_field_ownership_check CHECK (field_ownership IN ('app_owned', 'organizer_controlled')),\n  CONSTRAINT mission_occurrences_synchronization_state_check CHECK (synchronization_state IN ('local_only', 'pending', 'synced', 'failed')),\n  CONSTRAINT mission_occurrences_story_state_check CHECK (story_state IN ('none', 'draft', 'ready')),\n  CONSTRAINT mission_occurrences_deletion_state_check CHECK (deletion_state IN ('active', 'deleted')),\n  CONSTRAINT mission_occurrences_finish_after_start_check CHECK (finish_instant > start_instant),\n  CONSTRAINT mission_occurrences_version_check CHECK (version > 0),\n  CONSTRAINT mission_occurrences_effort_check CHECK ((all_day = false AND estimated_effort_minutes IS NULL) OR (all_day = true AND estimated_effort_minutes > 0)),",
              ),
              (
                  "  occurrence_id uuid NOT NULL REFERENCES mission_occurrences(id) ON DELETE CASCADE,\n  base_xp integer NOT NULL,",
                  "  occurrence_id uuid NOT NULL,\n  base_xp integer NOT NULL,",
              ),
          ]
          for old, new in sql_replacements:
              if migration.count(old) != 1:
                  raise SystemExit(f'Unexpected migration source shape for replacement: {old[:120]!r}')
              migration = migration.replace(old, new)
          sql_path.write_text(migration)
          PY
      - name: Commit GREEN and remove helper
        shell: bash
        run: |
          rm .github/workflows/mts-022-green-correction.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/database/src/schema.ts packages/database/migrations/0000_core.sql .github/workflows/mts-022-green-correction.yml
          git diff --cached --check
          git commit -m 'fix(database): enforce canonical occurrence persistence'
          git push origin HEAD:feat/mts-022-postgres-schema
      - name: Remove helper after failed correction
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          rm -f .github/workflows/mts-022-green-correction.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-green-correction.yml
          git diff --cached --quiet || git commit -m 'chore(database): remove failed MTS-022 GREEN helper'
          git push origin HEAD:feat/mts-022-postgres-schema
