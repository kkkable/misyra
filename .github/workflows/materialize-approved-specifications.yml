name: Materialize approved specifications

on:
  push:
    branches: [docs/add-approved-specifications]
    paths:
      - ".spec-upload/**"
      - ".github/workflows/materialize-approved-specifications.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/add-approved-specifications
          fetch-depth: 0

      - name: Reconstruct and verify approved specifications
        shell: bash
        run: |
          set -euo pipefail
          cat .spec-upload/chunk-* > /tmp/specs.b64
          base64 --decode /tmp/specs.b64 > /tmp/specs.tar.gz
          echo "9fcec83dbca7d42c64462df54bce5e7f8cbf38f8836e810050d3839e6abcf7cb  /tmp/specs.tar.gz" | sha256sum --check -

          mkdir -p docs/specifications
          tar -xzf /tmp/specs.tar.gz -C docs/specifications
          mv docs/specifications/mission-to-story-product-specification.md docs/specifications/product-specification.md
          mv docs/specifications/mission-to-story-technical-specification.md docs/specifications/technical-specification.md
          mv docs/specifications/mission-to-story-implementation-tickets.md docs/specifications/implementation-tickets.md

          echo "0ae0a547a886c6c66781d6f87663f18624c9966dd71041cc7d69e57279ec2528  docs/specifications/product-specification.md" | sha256sum --check -
          echo "a5bf05b9256593c779408a67a5d706f31f864e2d38b8f47e731eb57967487fda  docs/specifications/technical-specification.md" | sha256sum --check -
          echo "269925a1094f62f131a5c08b99a32241f82480c9d68f327ee463a434ad4170fd  docs/specifications/implementation-tickets.md" | sha256sum --check -

          rm -rf .spec-upload
          rm -f .github/workflows/materialize-approved-specifications.yml

      - name: Commit materialized specifications
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add approved Misyra specifications"
          git push origin HEAD:docs/add-approved-specifications
