name: MTS-022 Drizzle declaration patch probe

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-drizzle-declaration-patch-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install baseline
        run: pnpm install --frozen-lockfile
      - name: Install rc5 and prove declaration patch lands
        shell: bash
        run: |
          pnpm --filter @misyra/database add --save-exact --lockfile=false drizzle-orm@1.0.0-rc.5-169397b
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'PgPolicy': 'PgPolicyConfig',
              'PgRole': 'PgRoleConfig',
              'CockroachPolicy': 'CockroachPolicyConfig',
              'CockroachRole': 'CockroachRoleConfig',
          }
          files = list(Path('node_modules/.pnpm').glob('drizzle-orm@1.0.0-rc.5-169397b_*/node_modules/drizzle-orm/*-core/*.d.ts'))
          targets = [p for p in files if p.name in {'policies.d.ts', 'roles.d.ts'} and p.parent.name in {'pg-core', 'cockroach-core'}]
          if len(targets) != 4:
              raise SystemExit(f'expected 4 rc5 declarations, found {len(targets)}: {targets}')
          for path in targets:
              text = path.read_text()
              before = [line for line in text.splitlines() if 'export declare class ' in line]
              changed = text
              for class_name, config_name in replacements.items():
                  changed = re.sub(
                      rf'(export\s+declare\s+class\s+{class_name}\b[^{{\n]*?)\s+implements\s+{config_name}(\s*{{)',
                      r'\1\2',
                      changed,
                  )
              if changed == text:
                  raise SystemExit(f'no declaration changed in {path}; classes={before}')
              path.write_text(changed)
              after = [line for line in changed.splitlines() if 'export declare class ' in line]
              print(path)
              print('BEFORE', before)
              print('AFTER', after)
              if ' implements ' in '\n'.join(after):
                  raise SystemExit(f'implements clause remains in {path}')
          PY
      - name: Typecheck database with all repository strict flags unchanged
        run: pnpm --filter @misyra/database typecheck
      - name: Self-delete probe
        if: always()
        run: |
          git checkout -- packages/database/package.json
          rm .github/workflows/mts-022-drizzle-declaration-patch-probe.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-drizzle-declaration-patch-probe.yml
          git commit -m 'chore(database): remove Drizzle declaration patch probe'
          git push origin HEAD:feat/mts-022-postgres-schema
