name: MTS-022 Drizzle declaration patch probe

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-drizzle-declaration-patch-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install baseline
        run: pnpm install --frozen-lockfile
      - name: Install rc5 and patch only invalid declaration implements clauses in runner
        shell: bash
        run: |
          pnpm --filter @misyra/database add --save-exact --lockfile=false drizzle-orm@1.0.0-rc.5-169397b
          drizzle_dir=$(find node_modules/.pnpm -maxdepth 1 -type d -name 'drizzle-orm@1.0.0-rc.5-169397b_*' | head -n 1)/node_modules/drizzle-orm
          test -d "$drizzle_dir"
          sed -i 's/export declare class PgPolicy implements PgPolicyConfig/export declare class PgPolicy/' "$drizzle_dir/pg-core/policies.d.ts"
          sed -i 's/export declare class PgRole implements PgRoleConfig/export declare class PgRole/' "$drizzle_dir/pg-core/roles.d.ts"
          sed -i 's/export declare class CockroachPolicy implements CockroachPolicyConfig/export declare class CockroachPolicy/' "$drizzle_dir/cockroach-core/policies.d.ts"
          sed -i 's/export declare class CockroachRole implements CockroachRoleConfig/export declare class CockroachRole/' "$drizzle_dir/cockroach-core/roles.d.ts"
          grep -q 'export declare class PgPolicy ' "$drizzle_dir/pg-core/policies.d.ts"
          grep -q 'export declare class PgRole ' "$drizzle_dir/pg-core/roles.d.ts"
          grep -q 'export declare class CockroachPolicy ' "$drizzle_dir/cockroach-core/policies.d.ts"
          grep -q 'export declare class CockroachRole ' "$drizzle_dir/cockroach-core/roles.d.ts"
      - name: Typecheck database with all repository strict flags unchanged
        run: pnpm --filter @misyra/database typecheck
      - name: Self-delete probe
        if: always()
        run: |
          git checkout -- packages/database/package.json
          rm .github/workflows/mts-022-drizzle-declaration-patch-probe.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-drizzle-declaration-patch-probe.yml
          git commit -m 'chore(database): remove Drizzle declaration patch probe'
          git push origin HEAD:feat/mts-022-postgres-schema
