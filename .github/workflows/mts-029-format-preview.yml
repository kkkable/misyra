name: MTS-029 Story tombstone correction

on:
  push:
    branches:
      - verify/mts-029-format-preview-20260904

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-029-local-repositories
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Suppress Story drafts for tombstoned occurrences
        run: |
          test "$(git rev-parse HEAD)" = "15b1d51c806c75d51bc591dae34a6623a649c9d8"
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/storage/local-repositories.ts')
          source = path.read_text()
          start_marker = '  const getStoryDraft = async (occurrenceId: string): Promise<StoryDraft | null> => {'
          end_marker = '\n\n  const listSearchDocuments = async (limit: number): Promise<SearchDocument[]> => {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Story draft function markers not found')
          replacement = '''  const getStoryDraft = async (occurrenceId: string): Promise<StoryDraft | null> => {
            const row = await database.getFirstAsync<StoryDraftRow>(
              `SELECT d.occurrence_id, d.draft_id, d.composition_json, d.updated_at
                 FROM story_drafts d
                 JOIN cached_mission_occurrences o
                   ON o.account_id = d.account_id
                  AND o.occurrence_id = d.occurrence_id
                WHERE d.account_id = ?
                  AND d.occurrence_id = ?
                  AND json_extract(o.payload_json, '$.deletionState') <> 'deleted'`,
              accountId,
              occurrenceId,
            );
            return row === null
              ? null
              : {
                  occurrenceId: row.occurrence_id,
                  draftId: row.draft_id,
                  composition: parseJson(row.composition_json),
                  updatedAt: row.updated_at,
                };
          };'''
          source = source[:start] + replacement + source[end:]
          old_observe = "observe(() => getStoryDraft(occurrenceId), ['story_drafts']),"
          new_observe = "observe(() => getStoryDraft(occurrenceId), ['story_drafts', 'cached_mission_occurrences']),"
          if old_observe not in source:
              raise SystemExit('Story observer dependency block not found')
          path.write_text(source.replace(old_observe, new_observe, 1))
          PY
          pnpm exec prettier --write apps/mobile/src/storage/local-repositories.ts apps/mobile/src/storage/local-repositories.story-deletion.test.mjs --config packages/config/prettier.config.mjs
          git diff --check
          git config user.name "Misyra Auto Development"
          git config user.email "130823389+kkkable@users.noreply.github.com"
          git add apps/mobile/src/storage/local-repositories.ts apps/mobile/src/storage/local-repositories.story-deletion.test.mjs
          git commit -m "fix(mobile): suppress tombstoned Story drafts"
          git push origin HEAD:feat/mts-029-local-repositories
