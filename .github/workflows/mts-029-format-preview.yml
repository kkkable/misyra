name: MTS-029 format preview

on:
  push:
    branches:
      - verify/mts-029-format-preview-20260904

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-029-local-repositories
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier correction to active MTS-029 review test
        run: |
          test "$(git rev-parse HEAD)" = "a8260c782cae8a1a2acf110c098801a1c6a98cec"
          pnpm exec prettier --write apps/mobile/src/storage/local-repositories.review-corrections.test.mjs --config packages/config/prettier.config.mjs
          git diff --check
          if git diff --quiet -- apps/mobile/src/storage/local-repositories.review-corrections.test.mjs; then
            echo "No format correction needed"
            exit 0
          fi
          git config user.name "Misyra Auto Development"
          git config user.email "130823389+kkkable@users.noreply.github.com"
          git add apps/mobile/src/storage/local-repositories.review-corrections.test.mjs
          git commit -m "style(mobile): format MTS-029 review regressions"
          git push origin HEAD:feat/mts-029-local-repositories
