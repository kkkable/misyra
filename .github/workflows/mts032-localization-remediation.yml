name: Disposable MTS-032 localization verification

on:
  push:
    branches:
      - automation/mts032-localization-remediation-20260905

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-corrections-025-034
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format remediation files
        shell: bash
        run: |
          pnpm exec prettier --write apps/mobile/src/sync/conflict-application.ts apps/mobile/src/sync/conflict-application.test.mjs packages/localization/src/conflict-messages.test.ts packages/localization/src/locales/en.json packages/localization/src/locales/zh-HK.json --config packages/config/prettier.config.mjs
          if ! git diff --quiet; then
            git config user.name "Misyra Auto Development"
            git config user.email "actions@users.noreply.github.com"
            git add apps/mobile/src/sync/conflict-application.ts apps/mobile/src/sync/conflict-application.test.mjs packages/localization/src/conflict-messages.test.ts packages/localization/src/locales/en.json packages/localization/src/locales/zh-HK.json
            git commit -m "style(sync): format localization remediation"
            git push origin HEAD:fix/audit-corrections-025-034
          fi

      - name: Verify correction
        run: |
          pnpm exec prettier --check apps/mobile/src/sync/conflict-application.ts apps/mobile/src/sync/conflict-application.test.mjs packages/localization/src/conflict-messages.test.ts packages/localization/src/locales/en.json packages/localization/src/locales/zh-HK.json --config packages/config/prettier.config.mjs
          pnpm --filter @misyra/mobile typecheck
          pnpm --filter @misyra/mobile lint
          pnpm --filter @misyra/mobile test -- conflict-application.test.mjs
          pnpm --filter @misyra/localization typecheck
          pnpm --filter @misyra/localization lint
          pnpm --filter @misyra/localization test -- conflict-messages.test.ts
