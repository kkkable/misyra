name: MTS-037 Prettier Helper

on:
  push:
    branches:
      - verify/mts-037-prettier-20260905

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Format MTS-037 RED tests
        run: >-
          pnpm exec prettier --write
          apps/api/src/account-lifecycle.test.ts
          packages/database/src/account-deletion.test.ts
          --config packages/config/prettier.config.mjs
      - name: Commit formatted verification files
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/account-lifecycle.test.ts packages/database/src/account-deletion.test.ts; then
            exit 0
          fi
          git config user.name 'Misyra Verification Helper'
          git config user.email '130823389+kkkable@users.noreply.github.com'
          git add apps/api/src/account-lifecycle.test.ts packages/database/src/account-deletion.test.ts
          git commit -m 'chore(verify): materialize prettier output [skip ci]'
          git push origin HEAD:verify/mts-037-prettier-20260905
