name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTS004_INTEGRATION: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      CI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Bicep compiler in runner only
        run: az bicep install

      - name: Start deterministic local dependencies
        run: docker compose --file compose.yaml up -d --wait postgres azurite

      - name: Prove failing-fixture gates reject bad inputs
        run: pnpm ci:fixtures

      - name: Check workspace formatting
        run: pnpm format

      - name: Check CI-owned formatting
        run: pnpm format:ci

      - name: Lint workspaces
        run: pnpm lint

      - name: Lint CI-owned scripts and tests
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Diagnose migration 6 upgrade
        continue-on-error: true
        run: >-
          pnpm --filter @misyra/mobile exec vitest run
          src/storage/schema-general-note.test.mjs
          --config ../../packages/config/vitest.config.mjs

      - name: Diagnose root Node tests
        continue-on-error: true
        run: >-
          node --test
          tests/mts-001/*.test.mjs
          tests/mts-002/*.test.mjs
          tests/mts-003/*.test.mjs
          tests/mts-004/*.test.mjs
          tests/mts-006/*.test.mjs
          tests/mts-007/*.test.mjs
          tests/mts-008/*.test.mjs
          tests/mts-012/*.test.mjs

      - name: Diagnose full mobile test invocation
        continue-on-error: true
        run: pnpm --filter @misyra/mobile test

      - name: Diagnose sequential workspace tests
        continue-on-error: true
        run: pnpm turbo run test --concurrency=1

      - name: Repeat root Node tests
        continue-on-error: true
        run: >-
          node --test --test-concurrency=1
          tests/mts-001/*.test.mjs
          tests/mts-002/*.test.mjs
          tests/mts-003/*.test.mjs
          tests/mts-004/*.test.mjs
          tests/mts-006/*.test.mjs
          tests/mts-007/*.test.mjs
          tests/mts-008/*.test.mjs
          tests/mts-012/*.test.mjs

      - name: Repeat sequential workspace tests
        continue-on-error: true
        run: pnpm turbo run test --concurrency=1

      - name: Diagnose explicit combined sequence
        continue-on-error: true
        run: >-
          node --test --test-concurrency=1
          tests/mts-001/*.test.mjs
          tests/mts-002/*.test.mjs
          tests/mts-003/*.test.mjs
          tests/mts-004/*.test.mjs
          tests/mts-006/*.test.mjs
          tests/mts-007/*.test.mjs
          tests/mts-008/*.test.mjs
          tests/mts-012/*.test.mjs
          && pnpm turbo run test --concurrency=1

      - name: Diagnose config contract under pnpm lifecycle
        continue-on-error: true
        env:
          npm_lifecycle_event: test
          npm_lifecycle_script: node --test && turbo run test
          npm_command: run-script
        run: node --test tests/mts-002/config-contract.test.mjs

      - name: Diagnose root suite under pnpm lifecycle
        continue-on-error: true
        env:
          npm_lifecycle_event: test
          npm_lifecycle_script: node --test && turbo run test
          npm_command: run-script
        run: >-
          node --test --test-concurrency=1
          tests/mts-001/*.test.mjs
          tests/mts-002/*.test.mjs
          tests/mts-003/*.test.mjs
          tests/mts-004/*.test.mjs
          tests/mts-006/*.test.mjs
          tests/mts-007/*.test.mjs
          tests/mts-008/*.test.mjs
          tests/mts-012/*.test.mjs

      - name: Diagnose workspace suite under pnpm lifecycle
        continue-on-error: true
        env:
          npm_lifecycle_event: test
          npm_lifecycle_script: node --test && turbo run test
          npm_command: run-script
        run: pnpm turbo run test --concurrency=1

      - name: Run unit, integration, and mobile component tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Reject high and critical dependency findings
        run: pnpm audit --audit-level high

      - name: Scan tracked implementation and configuration for secrets
        run: pnpm ci:secrets

      - name: Verify localization completeness
        run: pnpm ci:localization

      - name: Verify privacy and logging boundaries
        run: pnpm ci:privacy

      - name: Compile Bicep and environment parameter shapes
        run: pnpm validate:infra

      - name: Verify contract compatibility boundary
        run: pnpm ci:contracts

      - name: Stop local dependencies
        if: always()
        run: docker compose --file compose.yaml down --volumes
