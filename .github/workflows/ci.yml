name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-calendar-selection-finalization:
    if: github.head_ref == 'fix/mts-044-051-cross-ticket-corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Finalize Calendar-owned mission selection
        run: |
          python - <<'PY'
          from pathlib import Path

          day_path = Path('apps/mobile/src/calendar/calendar-day-screen.tsx')
          day = day_path.read_text()

          required_once = [
              "  readonly selectedMissionId?: string;\n",
              "  selectedMissionId,\n  searchFocusTarget,",
              "      : (userSelectedMissionId ?? selectedMissionId);",
          ]
          for pattern in required_once:
              if day.count(pattern) != 1:
                  raise SystemExit(f'unexpected CalendarDayScreen pattern count for {pattern!r}: {day.count(pattern)}')

          day = day.replace("  readonly selectedMissionId?: string;\n", "", 1)
          day = day.replace("  selectedMissionId,\n  searchFocusTarget,", "  searchFocusTarget,", 1)
          day = day.replace(
              "      : (userSelectedMissionId ?? selectedMissionId);",
              "      : userSelectedMissionId;",
              1,
          )

          resolution_pattern = "userSelectedMissionId ?? selectedMissionId"
          if day.count(resolution_pattern) != 2:
              raise SystemExit(
                  f'unexpected mission-tap resolution count: {day.count(resolution_pattern)}'
              )
          day = day.replace(resolution_pattern, "userSelectedMissionId")

          if day.count('setUserSelectedMissionId') < 1 or day.count('userSelectedMissionId') < 1:
              raise SystemExit('expected Calendar-owned temporary selection state was not found')
          day = day.replace('setUserSelectedMissionId', 'setSelectedMissionId')
          day = day.replace('userSelectedMissionId', 'selectedMissionId')

          if 'readonly selectedMissionId?: string' in day:
              raise SystemExit('legacy external selectedMissionId prop remained')
          if 'userSelectedMissionId' in day or 'setUserSelectedMissionId' in day:
              raise SystemExit('temporary selection state name remained')

          day_path.write_text(day)

          route_path = Path('apps/mobile/src/calendar/calendar-route-adjustment.test.mjs')
          route = route_path.read_text()

          timed = """    await act(async () => {\n      state.childProps.onTimedMissionPress({ id: '44444444-4444-4444-8444-444444444444' });\n    });\n    await act(async () => {\n      state.childProps.onTimedMissionPress({ id: '44444444-4444-4444-8444-444444444444' });\n    });\n"""
          timed_once = """    await act(async () => {\n      state.childProps.onTimedMissionPress({ id: '44444444-4444-4444-8444-444444444444' });\n    });\n"""
          all_day = """    await act(async () => {\n      state.childProps.onAllDayMissionPress({ id: '55555555-5555-4555-8555-555555555555' });\n    });\n    await act(async () => {\n      state.childProps.onAllDayMissionPress({ id: '55555555-5555-4555-8555-555555555555' });\n    });\n"""
          all_day_once = """    await act(async () => {\n      state.childProps.onAllDayMissionPress({ id: '55555555-5555-4555-8555-555555555555' });\n    });\n"""

          if route.count(timed) != 1 or route.count(all_day) != 1:
              raise SystemExit(
                  f'unexpected stale route callback blocks: timed={route.count(timed)} all_day={route.count(all_day)}'
              )
          route = route.replace(timed, timed_once, 1).replace(all_day, all_day_once, 1)
          route_path.write_text(route)
          PY

          pnpm exec prettier --write \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-route-adjustment.test.mjs \
            --config packages/config/prettier.config.mjs

          git checkout origin/${{ github.event.pull_request.base.ref }} -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-route-adjustment.test.mjs
          git commit -m "fix: finalize Calendar-owned mission selection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
