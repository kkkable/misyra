name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm (pinned via packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck application workspaces
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium (MTS-012 screenshot harness)
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
        # Normal CI is intentionally read-only with respect to the committed
        # image baselines: the MTS-012 screenshot-generation contract
        # forbids baseline-writer commands in push/pull_request workflows,
        # and the explicit baseline-regeneration command is only run by a
        # human/worker (or the manual update workflow, which is not
        # push/pull_request-triggered) and reviewed as a Git diff.

      - name: Scan for committed secrets
        run: pnpm secret:scan

      - name: Verify localization completeness
        run: pnpm localization:check

      - name: Privacy/logging static check
        run: pnpm privacy:check

      - name: Forbidden hard-coded colour check
        run: pnpm hardcoded-color:check

      - name: Validate infrastructure contracts
        run: pnpm infra:validate

      - name: Install pinned Bicep CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bicep-cli"
          curl -fsSL -o "$RUNNER_TEMP/bicep-cli/bicep" https://github.com/Azure/bicep/releases/download/v0.45.6/bicep-linux-x64
          cd "$RUNNER_TEMP/bicep-cli"
          echo "3fae480c469677788f1552f55e70e31c8084f80769c7e8353118327e0ab361e4  bicep" | sha256sum -c -
          chmod +x bicep
          echo "$RUNNER_TEMP/bicep-cli" >> "$GITHUB_PATH"

      - name: Install pinned Bicep CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bicep-cli"
          curl -fsSL -o "$RUNNER_TEMP/bicep-cli/bicep.exe" https://github.com/Azure/bicep/releases/download/v0.45.6/bicep-win-x64.exe
          cd "$RUNNER_TEMP/bicep-cli"
          echo "38c8cd33ba8f0ac4ffd2b8114382b69cb62ffe1d040fde7e622d78ce77acb56e  bicep.exe" | sha256sum -c -
          echo "$RUNNER_TEMP/bicep-cli" >> "$GITHUB_PATH"

      - name: Compile Bicep skeleton statically
        run: pnpm bicep:validate

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  mobile-visual-regression:
    name: Mobile visual regression (android emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space for the Android build
        shell: bash
        run: |
          # The MTS-012 emulator job stacks pnpm store + node_modules +
          # Playwright Chromium + Android SDK/emulator/system image + Gradle
          # build outputs on the ubuntu-latest runner. Remove the large
          # pre-installed toolchains this job does not need so the release
          # APK build cannot exhaust the runner disk.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up pnpm (pinned via packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (supplemental web layer)
        run: pnpm exec playwright install chromium

      - name: Build workspace packages (harness bundle prerequisites)
        # The harness APK's Metro bundle resolves the real
        # @misyra/design-tokens and @misyra/localization packages, whose
        # dist output must exist before Gradle bundles the JS. Only those
        # two packages are needed; the full monorepo build is not.
        run: pnpm --filter @misyra/design-tokens --filter @misyra/localization build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install emulator and system image
        run: |
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64" "platform-tools"
          yes | sdkmanager --licenses >/dev/null

      - name: Generate the android project (image-harness build)
        run: |
          cd apps/mobile
          MISYRA_HARNESS_BUILD=1 pnpm exec expo prebuild --platform android --no-install

      - name: Point the release bundle at the image-harness entry
        run: node apps/mobile/scripts/prepare-harness-android.mjs

      - name: Build the release APK
        run: |
          cd apps/mobile/android
          ./gradlew :app:assembleRelease --no-daemon

      # Read-only authoritative mobile gate: captures fresh android
      # framebuffer screenshots on a deterministic emulator and compares
      # them against the committed image-baselines/android namespace. It
      # never writes baselines (the explicit update workflow does).
      - name: Run MTS-012 mobile visual regression contracts on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: misyra
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            MISYRA_ANDROID_DEVICE=1 node --test tests/mts-012/

  integration:
    name: Local-service integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm (pinned via packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local services
        run: pnpm dev:up

      - name: Run local-service integration suite
        run: pnpm test:services

      - name: Stop local services
        if: always()
        run: pnpm dev:down
