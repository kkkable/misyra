name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mts053-green-helper:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/mts-053-app-time-zone-travel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-053-app-time-zone-travel
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply MTS-053 GREEN implementation and restore CI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new))

          path = 'apps/mobile/src/sync/authenticated-sync-runtime.ts'
          replace_once(
              path,
              """type DeviceMetadata = Readonly<{\n  platform: 'ios' | 'android';\n  appVersion: string;\n  notificationCapability: 'not_determined' | 'denied' | 'authorized' | 'unavailable';\n}>;""",
              """type DeviceMetadata = Readonly<{\n  platform: 'ios' | 'android';\n  appVersion: string;\n  notificationCapability: 'not_determined' | 'denied' | 'authorized' | 'unavailable';\n  timeZone?: string | undefined;\n}>;""",
          )
          replace_once(
              path,
              """async function applyAccountSettings(\n  database: SyncDatabase,\n  accountId: string,\n  settings: AccountSettings,\n  updatedAt: string,\n) {\n  await database.runAsync(\n    `INSERT INTO local_accounts\n       (account_id, created_at, language, trust_mode, settings_updated_at)\n     VALUES (?, CURRENT_TIMESTAMP, ?, ?, ?)\n     ON CONFLICT(account_id) DO UPDATE SET\n       language = excluded.language,\n       trust_mode = excluded.trust_mode,\n       settings_updated_at = excluded.settings_updated_at`,\n    accountId,\n    settings.language,\n    settings.trustMode ? 1 : 0,\n    updatedAt,\n  );\n}""",
              """async function applyAccountSettings(\n  database: SyncDatabase,\n  accountId: string,\n  settings: AccountSettings,\n  updatedAt: string,\n) {\n  if (settings.appTimeZone === undefined) {\n    await database.runAsync(\n      `INSERT INTO local_accounts\n         (account_id, created_at, language, trust_mode, settings_updated_at)\n       VALUES (?, CURRENT_TIMESTAMP, ?, ?, ?)\n       ON CONFLICT(account_id) DO UPDATE SET\n         language = excluded.language,\n         trust_mode = excluded.trust_mode,\n         settings_updated_at = excluded.settings_updated_at`,\n      accountId,\n      settings.language,\n      settings.trustMode ? 1 : 0,\n      updatedAt,\n    );\n    return;\n  }\n\n  await database.runAsync(\n    `INSERT INTO local_accounts\n       (account_id, created_at, language, trust_mode, app_time_zone, settings_updated_at)\n     VALUES (?, CURRENT_TIMESTAMP, ?, ?, ?, ?)\n     ON CONFLICT(account_id) DO UPDATE SET\n       language = excluded.language,\n       trust_mode = excluded.trust_mode,\n       app_time_zone = excluded.app_time_zone,\n       settings_updated_at = excluded.settings_updated_at`,\n    accountId,\n    settings.language,\n    settings.trustMode ? 1 : 0,\n    settings.appTimeZone,\n    updatedAt,\n  );\n}""",
          )
          replace_once(
              path,
              """    if (settings !== null) {\n      await transaction.runAsync(\n        `UPDATE local_accounts\n            SET language = ?,\n                trust_mode = ?,\n                settings_updated_at = ?\n          WHERE account_id = ?`,\n        settings.language,\n        settings.trustMode ? 1 : 0,\n        new Date().toISOString(),\n        accountId,\n      );\n      continue;\n    }""",
              """    if (settings !== null) {\n      const settingsUpdatedAt = new Date().toISOString();\n      if (settings.appTimeZone === undefined) {\n        await transaction.runAsync(\n          `UPDATE local_accounts\n              SET language = ?,\n                  trust_mode = ?,\n                  settings_updated_at = ?\n            WHERE account_id = ?`,\n          settings.language,\n          settings.trustMode ? 1 : 0,\n          settingsUpdatedAt,\n          accountId,\n        );\n      } else {\n        await transaction.runAsync(\n          `UPDATE local_accounts\n              SET language = ?,\n                  trust_mode = ?,\n                  app_time_zone = ?,\n                  settings_updated_at = ?\n            WHERE account_id = ?`,\n          settings.language,\n          settings.trustMode ? 1 : 0,\n          settings.appTimeZone,\n          settingsUpdatedAt,\n          accountId,\n        );\n      }\n      continue;\n    }""",
          )
          replace_once(
              path,
              """export function createAuthenticatedSyncRuntime({\n  sessionProvider,""",
              """export type AuthenticatedSyncTimeZoneNotice = Readonly<{\n  language: AccountSettings['language'];\n  timeZone: string;\n}>;\n\nexport type AuthenticatedSyncRunResult = Readonly<{\n  accountId: string;\n  deviceId: string;\n  cursor: number;\n  timeZoneNotice?: AuthenticatedSyncTimeZoneNotice | null;\n}>;\n\nexport function createAuthenticatedSyncRuntime({\n  sessionProvider,""",
          )
          replace_once(
              path,
              """  let runTail: Promise<Readonly<{ accountId: string; deviceId: string; cursor: number }> | null> =\n    Promise.resolve(null);""",
              """  let runTail: Promise<AuthenticatedSyncRunResult | null> = Promise.resolve(null);""",
          )
          replace_once(
              path,
              """    const metadata = await deviceMetadata();\n    const api = apiFactory(session);\n    const registration = await api.registerDevice({ installationId, ...metadata });\n    await rememberDeviceId(installationStore, session.accountId, registration.deviceId);\n\n    const [database, settings] = await Promise.all([openDatabase(), api.getAccountSettings()]);\n    await applyAccountSettings(database, session.accountId, settings, now().toISOString());\n    const result = await runServerSync({ database, accountId: session.accountId, api });\n    return {\n      accountId: session.accountId,\n      deviceId: registration.deviceId,\n      cursor: result.cursor,\n    };""",
              """    const metadata = await deviceMetadata();\n    const observedTimeZone = metadata.timeZone;\n    const api = apiFactory(session);\n    const registration = await api.registerDevice({ installationId, ...metadata });\n    await rememberDeviceId(installationStore, session.accountId, registration.deviceId);\n\n    const [database, settings] = await Promise.all([openDatabase(), api.getAccountSettings()]);\n    await applyAccountSettings(database, session.accountId, settings, now().toISOString());\n    const result = await runServerSync({ database, accountId: session.accountId, api });\n    const timeZoneNotice =\n      observedTimeZone === undefined\n        ? undefined\n        : registration.timeZoneChanged === true\n          ? {\n              language: settings.language,\n              timeZone: settings.appTimeZone ?? observedTimeZone,\n            }\n          : null;\n    return {\n      accountId: session.accountId,\n      deviceId: registration.deviceId,\n      cursor: result.cursor,\n      ...(timeZoneNotice === undefined ? {} : { timeZoneNotice }),\n    };""",
          )

          path = 'apps/mobile/src/sync/root-sync-runtime.ts'
          replace_once(
              path,
              """import * as SecureStore from 'expo-secure-store';\nimport { Platform } from 'react-native';""",
              """import { getCalendars } from 'expo-localization';\nimport * as SecureStore from 'expo-secure-store';\nimport { Platform } from 'react-native';""",
          )
          replace_once(
              path,
              """  return Promise.resolve({\n    platform,\n    appVersion,\n    notificationCapability: 'not_determined' as const,\n  });""",
              """  const localizedTimeZone = getCalendars()[0]?.timeZone;\n  const intlTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;\n  const timeZone =\n    typeof localizedTimeZone === 'string' && localizedTimeZone.length > 0\n      ? localizedTimeZone\n      : intlTimeZone;\n  if (typeof timeZone !== 'string' || timeZone.length === 0) {\n    throw new Error('device_time_zone_unavailable');\n  }\n\n  return Promise.resolve({\n    platform,\n    appVersion,\n    notificationCapability: 'not_determined' as const,\n    timeZone,\n  });""",
          )

          Path('apps/mobile/src/localization/app-time-zone-runtime.ts').write_text("""import { useEffect, useRef, useState } from 'react';\n\nimport { rootAuthStorage } from '../auth/auth-runtime.js';\nimport { openMobileDatabase } from '../storage/database.js';\nimport { createLocalRepositories, type LocalRepositories } from '../storage/local-repositories.js';\n\nconst TIME_ZONE_REFRESH_INTERVAL_MS = 60_000;\nconst INITIAL_SYNC_RECHECK_MS = 1_000;\n\nfunction deviceTimeZone(): string {\n  const value = Intl.DateTimeFormat().resolvedOptions().timeZone;\n  return typeof value === 'string' && value.length > 0 ? value : 'UTC';\n}\n\nexport function useAppTimeZone(): string {\n  const deviceZone = useRef(deviceTimeZone()).current;\n  const [timeZone, setTimeZone] = useState(deviceZone);\n\n  useEffect(() => {\n    let active = true;\n    let repositories: LocalRepositories | null = null;\n    let repositoryAccountId: string | null = null;\n    let refreshInFlight: Promise<void> | null = null;\n\n    const readSettings = async (accountId: string) => {\n      if (repositories === null || repositoryAccountId !== accountId) {\n        const database = await openMobileDatabase();\n        repositories = createLocalRepositories(database, accountId);\n        repositoryAccountId = accountId;\n      }\n      return repositories.settings.get();\n    };\n\n    const refreshTimeZone = () => {\n      if (refreshInFlight !== null) return refreshInFlight;\n      refreshInFlight = rootAuthStorage\n        .read()\n        .then(async (session) => {\n          if (session === null) return deviceZone;\n          const settings = await readSettings(session.accountId);\n          return settings?.appTimeZone ?? deviceZone;\n        })\n        .then((resolvedTimeZone) => {\n          if (active) setTimeZone(resolvedTimeZone);\n        })\n        .catch(() => undefined)\n        .finally(() => {\n          refreshInFlight = null;\n        });\n      return refreshInFlight;\n    };\n\n    void refreshTimeZone();\n    const initialSyncRecheck = setTimeout(() => {\n      void refreshTimeZone();\n    }, INITIAL_SYNC_RECHECK_MS);\n    const refreshInterval = setInterval(() => {\n      void refreshTimeZone();\n    }, TIME_ZONE_REFRESH_INTERVAL_MS);\n\n    return () => {\n      active = false;\n      clearTimeout(initialSyncRecheck);\n      clearInterval(refreshInterval);\n    };\n  }, [deviceZone]);\n\n  return timeZone;\n}\n""")

          Path('apps/mobile/src/calendar/calendar-travel-projection.ts').write_text("""import {\n  createMissionOccurrence,\n  projectScheduleToTimeZone,\n  type MissionOccurrence,\n} from '@misyra/domain';\n\nexport function projectMissionOccurrenceForAppTimeZone(\n  occurrence: MissionOccurrence,\n  appTimeZone: string,\n): MissionOccurrence {\n  if (occurrence.completionState === 'completed') return occurrence;\n\n  return createMissionOccurrence({\n    ...occurrence,\n    schedule: projectScheduleToTimeZone({\n      schedule: occurrence.schedule,\n      destinationTimeZone: appTimeZone,\n    }),\n  });\n}\n\nfunction requiredPart(parts: Intl.DateTimeFormatPart[], type: Intl.DateTimeFormatPartTypes): string {\n  const value = parts.find((part) => part.type === type)?.value;\n  if (value === undefined) throw new Error(`App time-zone formatting omitted ${type}.`);\n  return value;\n}\n\nexport function calendarClockForAppTimeZone(\n  now: Date,\n  appTimeZone: string,\n): Readonly<{ localDate: string; minute: number }> {\n  const parts = new Intl.DateTimeFormat('en-CA', {\n    timeZone: appTimeZone,\n    year: 'numeric',\n    month: '2-digit',\n    day: '2-digit',\n    hour: '2-digit',\n    minute: '2-digit',\n    hourCycle: 'h23',\n  }).formatToParts(now);\n  const year = requiredPart(parts, 'year');\n  const month = requiredPart(parts, 'month');\n  const day = requiredPart(parts, 'day');\n  const hour = Number(requiredPart(parts, 'hour'));\n  const minute = Number(requiredPart(parts, 'minute'));\n  return {\n    localDate: `${year}-${month}-${day}`,\n    minute: hour * 60 + minute,\n  };\n}\n""")

          Path('apps/mobile/src/sync/app-time-zone-notice.tsx').write_text("""import { StyleSheet, Text, View } from 'react-native';\n\nimport { radius, space, typography } from '@misyra/design-tokens';\nimport { localizationCatalogs, type LocalizationLocale } from '@misyra/localization';\n\nimport { themeColors, type ColorScheme } from '../design-system/index.js';\n\ntype AppTimeZoneNoticeProps = Readonly<{\n  colorScheme: ColorScheme;\n  language: LocalizationLocale;\n  timeZone: string;\n}>;\n\nexport function AppTimeZoneNotice({\n  colorScheme,\n  language,\n  timeZone,\n}: AppTimeZoneNoticeProps) {\n  const colors = themeColors(colorScheme);\n  const message = localizationCatalogs[language]['sync.timeZone.updated'].replace(\n    '{timeZone}',\n    timeZone,\n  );\n\n  return (\n    <View\n      accessibilityLiveRegion=\"polite\"\n      style={[\n        styles.container,\n        { backgroundColor: colors.surfaceRaised, borderColor: colors.border },\n      ]}\n      testID=\"app-time-zone-change-notice\"\n    >\n      <Text allowFontScaling style={[styles.message, { color: colors.textPrimary }]}>\n        {message}\n      </Text>\n    </View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  container: {\n    borderRadius: radius.md,\n    borderWidth: 1,\n    left: space[4],\n    paddingHorizontal: space[3],\n    paddingVertical: space[2],\n    position: 'absolute',\n    right: space[4],\n    top: space[4],\n    zIndex: 30,\n  },\n  message: {\n    fontSize: typography.bodySmall.fontSize,\n    fontWeight: typography.bodySmall.fontWeight,\n  },\n});\n""")

          path = 'packages/localization/src/index.ts'
          file = Path(path)
          lines = file.read_text().splitlines()
          anchors = [i for i, line in enumerate(lines) if "'sync.conflict.storyUpdated':" in line]
          if len(anchors) != 2:
              raise SystemExit(f'{path}: expected two sync conflict anchors, found {len(anchors)}')
          lines.insert(anchors[1], "    'sync.timeZone.updated': '時區已更新為 {timeZone}。',")
          lines.insert(anchors[0], "    'sync.timeZone.updated': 'Time zone updated to {timeZone}.',")
          file.write_text('\n'.join(lines) + '\n')

          path = 'apps/mobile/src/sync/sync-runtime-gate.tsx'
          replace_once(
              path,
              """import { AppState } from 'react-native';\n\nimport { rootSyncRuntime } from './root-sync-runtime.js';""",
              """import { AppState, useColorScheme } from 'react-native';\n\nimport { AppTimeZoneNotice } from './app-time-zone-notice.js';\nimport { rootSyncRuntime } from './root-sync-runtime.js';""",
          )
          replace_once(
              path,
              """function SyncRuntimeRunner({ children, runtime }: PropsWithChildren<{ runtime: SyncRuntime }>) {\n  const query = useQuery({\n    queryKey: ['authenticated-sync-runtime'],\n    queryFn: () => runtime.run(),\n    networkMode: 'always',\n    refetchInterval: FOREGROUND_SYNC_INTERVAL_MS,\n    refetchIntervalInBackground: false,\n    refetchOnMount: 'always',\n    refetchOnWindowFocus: 'always',\n  });\n  void query;\n  return children;\n}""",
              """type TimeZoneNotice = Readonly<{\n  language: 'en' | 'zh-HK';\n  timeZone: string;\n}>;\n\nfunction timeZoneNoticeFromResult(value: unknown): TimeZoneNotice | null {\n  if (typeof value !== 'object' || value === null || Array.isArray(value)) return null;\n  const notice = (value as { timeZoneNotice?: unknown }).timeZoneNotice;\n  if (typeof notice !== 'object' || notice === null || Array.isArray(notice)) return null;\n  const language = (notice as { language?: unknown }).language;\n  const timeZone = (notice as { timeZone?: unknown }).timeZone;\n  if ((language !== 'en' && language !== 'zh-HK') || typeof timeZone !== 'string') return null;\n  return { language, timeZone };\n}\n\nfunction SyncRuntimeRunner({ children, runtime }: PropsWithChildren<{ runtime: SyncRuntime }>) {\n  const nativeColorScheme = useColorScheme();\n  const query = useQuery({\n    queryKey: ['authenticated-sync-runtime'],\n    queryFn: () => runtime.run(),\n    networkMode: 'always',\n    refetchInterval: FOREGROUND_SYNC_INTERVAL_MS,\n    refetchIntervalInBackground: false,\n    refetchOnMount: 'always',\n    refetchOnWindowFocus: 'always',\n  });\n  const notice = timeZoneNoticeFromResult(query.data);\n  void query;\n  if (notice === null) return children;\n  return (\n    <>\n      {children}\n      <AppTimeZoneNotice\n        colorScheme={nativeColorScheme === 'dark' ? 'dark' : 'light'}\n        language={notice.language}\n        timeZone={notice.timeZone}\n      />\n    </>\n  );\n}""",
          )

          path = 'apps/mobile/src/calendar/calendar-interactive-timeline.tsx'
          replace_once(
              path,
              """  today: string;\n  uses24HourClock?: boolean;\n}>;""",
              """  today: string;\n  timeZone?: string;\n  uses24HourClock?: boolean;\n}>;""",
          )
          replace_once(
              path,
              """  selectedDate,\n  today,\n  uses24HourClock = true,\n}: CalendarInteractiveTimelineProps) {""",
              """  selectedDate,\n  today,\n  timeZone,\n  uses24HourClock = true,\n}: CalendarInteractiveTimelineProps) {""",
          )
          replace_once(
              path,
              """  const systemCalendar = getCalendars()[0];\n  const missionTimeZone = systemCalendar.timeZone ?? 'UTC';""",
              """  const systemCalendar = getCalendars()[0];\n  const missionTimeZone = timeZone ?? systemCalendar.timeZone ?? 'UTC';""",
          )

          path = 'apps/mobile/src/calendar/calendar-day-screen.tsx'
          replace_once(
              path,
              """import { resolveCalendarMissionTap } from './calendar-mission-selection.js';""",
              """import { resolveCalendarMissionTap } from './calendar-mission-selection.js';\nimport { calendarClockForAppTimeZone } from './calendar-travel-projection.js';""",
          )
          replace_once(
              path,
              """  readonly now?: Date;\n  readonly language?: LocalizationLocale;""",
              """  readonly now?: Date;\n  readonly language?: LocalizationLocale;\n  readonly appTimeZone?: string;""",
          )
          replace_once(
              path,
              """export function CalendarDayScreen({\n  now = new Date(),\n  language = 'en',""",
              """export function CalendarDayScreen({\n  now = new Date(),\n  language = 'en',\n  appTimeZone,""",
          )
          replace_once(
              path,
              """  const responsive = resolveResponsiveCalendarLayout(width);\n  const today = localDateFromNow(now);""",
              """  const responsive = resolveResponsiveCalendarLayout(width);\n  const appClock =\n    appTimeZone === undefined ? null : calendarClockForAppTimeZone(now, appTimeZone);\n  const today = appClock?.localDate ?? localDateFromNow(now);""",
          )
          replace_once(
              path,
              """  const currentMinute = minuteOfDay(now);""",
              """  const currentMinute = appClock?.minute ?? minuteOfDay(now);""",
          )
          replace_once(
              path,
              """          selectedDate={selectedDate}\n          today={today}\n          uses24HourClock={uses24HourClock}""",
              """          selectedDate={selectedDate}\n          today={today}\n          {...(appTimeZone === undefined ? {} : { timeZone: appTimeZone })}\n          uses24HourClock={uses24HourClock}""",
          )

          path = 'apps/mobile/src/calendar/calendar-route-screen.tsx'
          replace_once(
              path,
              """import { useAppLanguage } from '../localization/use-app-language.js';""",
              """import { useAppLanguage } from '../localization/use-app-language.js';\nimport { useAppTimeZone } from '../localization/app-time-zone-runtime.js';""",
          )
          replace_once(
              path,
              """import type { MissionCardStatus, TimedMissionSummary } from './calendar-mission-layout.js';""",
              """import type { MissionCardStatus, TimedMissionSummary } from './calendar-mission-layout.js';\nimport { projectMissionOccurrenceForAppTimeZone } from './calendar-travel-projection.js';""",
          )
          replace_once(
              path,
              """function replaceMissionMap<T extends { readonly id: string }>(""",
              """function projectLocalMissionForAppTimeZone(\n  mission: LocalMission,\n  appTimeZone: string,\n): LocalMission {\n  return {\n    ...mission,\n    occurrence: projectMissionOccurrenceForAppTimeZone(mission.occurrence, appTimeZone),\n  };\n}\n\nfunction replaceMissionMap<T extends { readonly id: string }>(""",
          )
          replace_once(
              path,
              """  const router = useRouter();\n  const language = useAppLanguage();""",
              """  const router = useRouter();\n  const language = useAppLanguage();\n  const appTimeZone = useAppTimeZone();""",
          )
          replace_once(
              path,
              """    const missions = await repositories.calendar.listWindow(calendarWindow(new Date()));\n    const maps = calendarMissionMaps(missions);\n    setAllDayMissionsByDate(maps.allDay);\n    setTimedMissionsByDate(maps.timed);\n  }, []);""",
              """    const missions = await repositories.calendar.listWindow(calendarWindow(new Date()));\n    const projectedMissions = missions.map((mission) =>\n      projectLocalMissionForAppTimeZone(mission, appTimeZone),\n    );\n    const maps = calendarMissionMaps(projectedMissions);\n    setAllDayMissionsByDate(maps.allDay);\n    setTimedMissionsByDate(maps.timed);\n  }, [appTimeZone]);""",
          )
          replace_once(
              path,
              """          const mission = await repositories.missions.getById(result.occurrenceId);\n          return {\n            ...result,\n            personalNoteExcerpt: visibleCalendarSearchPersonalNoteExcerpt(result, mission),\n            localDate: mission?.occurrence.schedule.localStart.slice(0, 10) ?? null,\n          };""",
              """          const mission = await repositories.missions.getById(result.occurrenceId);\n          const projectedMission =\n            mission === null ? null : projectLocalMissionForAppTimeZone(mission, appTimeZone);\n          return {\n            ...result,\n            personalNoteExcerpt: visibleCalendarSearchPersonalNoteExcerpt(result, mission),\n            localDate: projectedMission?.occurrence.schedule.localStart.slice(0, 10) ?? null,\n          };""",
          )
          replace_once(
              path,
              """    },\n    [],\n  );\n\n  const openSearchResult""",
              """    },\n    [appTimeZone],\n  );\n\n  const openSearchResult""",
          )
          replace_once(
              path,
              """      const mission = await repositories.missions.getById(result.occurrenceId);\n      if (mission === null) return false;\n      const resolution = await resolveCalendarSearchNavigation(result, () =>\n        Promise.resolve(mission),\n      );\n      if (resolution.kind === 'unavailable') return false;\n\n      const focusedMaps = calendarMissionMaps([mission]);""",
              """      const mission = await repositories.missions.getById(result.occurrenceId);\n      if (mission === null) return false;\n      const projectedMission = projectLocalMissionForAppTimeZone(mission, appTimeZone);\n      const resolution = await resolveCalendarSearchNavigation(result, () =>\n        Promise.resolve(projectedMission),\n      );\n      if (resolution.kind === 'unavailable') return false;\n\n      const focusedMaps = calendarMissionMaps([projectedMission]);""",
          )
          replace_once(
              path,
              """    [router],\n  );\n\n  return (""",
              """    [appTimeZone, router],\n  );\n\n  return (""",
          )
          replace_once(
              path,
              """      <CalendarDayScreen\n        allDayMissionsByDate={allDayMissionsByDate}\n        language={language}""",
              """      <CalendarDayScreen\n        allDayMissionsByDate={allDayMissionsByDate}\n        appTimeZone={appTimeZone}\n        language={language}""",
          )
          PY

          pnpm exec prettier --write \
            apps/api/src/device-settings.ts \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-interactive-timeline.tsx \
            apps/mobile/src/calendar/calendar-route-screen.tsx \
            apps/mobile/src/calendar/calendar-travel-projection.ts \
            apps/mobile/src/localization/app-time-zone-runtime.ts \
            apps/mobile/src/sync/app-time-zone-notice.tsx \
            apps/mobile/src/sync/authenticated-sync-runtime.ts \
            apps/mobile/src/sync/root-sync-runtime.ts \
            apps/mobile/src/sync/sync-runtime-gate.tsx \
            packages/contracts/src/v1/device-settings.ts \
            packages/database/src/device-settings-store.ts \
            packages/database/src/device-settings-time-zone.test.ts \
            packages/localization/src/index.ts \
            --config packages/config/prettier.config.mjs

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "misyra-ci-helper"
          git config user.email "misyra-ci-helper@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/mobile apps/api/src/device-settings.ts packages/contracts/src/v1/device-settings.ts packages/database packages/localization/src/index.ts
          git commit -m "feat: implement MTS-053 app time-zone travel behavior"
          git push origin HEAD:feat/mts-053-app-time-zone-travel
