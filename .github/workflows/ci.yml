name: MTS-028 Format Helper

on:
  push:
    branches:
      - verify/mts-028-format-20260904

permissions:
  contents: write

jobs:
  format-red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact MTS-028 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-028-mobile-sqlite-schema
          fetch-depth: 0
          persist-credentials: true

      - name: Verify expected RED head
        run: test "$(git rev-parse HEAD)" = "a570086027e0f043b48a412a6ef654bc435cf68f"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Format only the MTS-028 RED test
        run: pnpm exec prettier --write apps/mobile/src/storage/schema.test.mjs --config packages/config/prettier.config.mjs

      - name: Prove formatting touched no other file
        run: |
          test -z "$(git diff --name-only | grep -v '^apps/mobile/src/storage/schema.test.mjs$')"
          git diff --check

      - name: Commit formatted RED test to active branch
        run: |
          if git diff --quiet -- apps/mobile/src/storage/schema.test.mjs; then
            echo "No formatting change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/storage/schema.test.mjs
          git commit -m "test(mts-028): format SQLite schema contract"
          git push origin HEAD:feat/mts-028-mobile-sqlite-schema
