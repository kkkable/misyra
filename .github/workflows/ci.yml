name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-mts052-red:
    if: github.head_ref == 'feat/mts-052-recurring-scope-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout MTS-052 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Normalize RED fixtures and restore CI
        run: |
          pnpm exec prettier --write \
            apps/mobile/src/calendar/calendar-recurring-scope-flow.test.mjs \
            apps/mobile/src/calendar/calendar-recurring-scope-delete.test.mjs \
            apps/mobile/src/calendar/calendar-recurring-scope-adjustment.test.mjs \
            packages/database/src/sync-store-recurring-scope.test.ts \
            --config packages/config/prettier.config.mjs

          git checkout origin/${{ github.event.pull_request.base.ref }} -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            apps/mobile/src/calendar/calendar-recurring-scope-flow.test.mjs \
            apps/mobile/src/calendar/calendar-recurring-scope-delete.test.mjs \
            apps/mobile/src/calendar/calendar-recurring-scope-adjustment.test.mjs \
            packages/database/src/sync-store-recurring-scope.test.ts
          git commit -m "test: format reconciled MTS-052 RED fixtures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
