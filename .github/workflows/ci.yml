name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sync correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/mts031-039-sync-runtime-integration
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format correction files and commit
        run: |
          pnpm exec prettier \
            apps/mobile/app/_layout.tsx \
            apps/mobile/src/sync/authenticated-sync-api.ts \
            apps/mobile/src/sync/authenticated-sync-runtime.ts \
            --write --config packages/config/prettier.config.mjs
          git config user.name "Misyra Auto Development"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mobile/app/_layout.tsx \
            apps/mobile/src/sync/authenticated-sync-api.ts \
            apps/mobile/src/sync/authenticated-sync-runtime.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style(sync): format runtime correction"
          git push origin HEAD:fix/mts031-039-sync-runtime-integration
