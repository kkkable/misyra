name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Patch canonical reward basis schema
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const schemaPath = 'packages/database/src/schema.ts';
          let schema = fs.readFileSync(schemaPath, 'utf8');
          const tableMarker = 'export const missionOccurrenceTombstones = pgTable(';
          const coreMarker = '  missionOccurrences,\n  missionOccurrenceTombstones,';
          if (!schema.includes('export const missionRewardBasis = pgTable(')) {
            if (schema.split(tableMarker).length !== 2) throw new Error('mission table marker mismatch');
            const block = `export const missionRewardBasis = pgTable(
  'mission_reward_basis',
  {
    occurrenceId: uuid('occurrence_id').primaryKey(),
    accountId: uuid('account_id').notNull(),
    difficulty: text('difficulty'),
    baseXp: integer('base_xp').notNull(),
    revokedAt: timestamp('revoked_at', { withTimezone: true }),
    updatedAt: updatedAt(),
  },
  (table) => [
    index('mission_reward_basis_account_idx').on(table.accountId),
    foreignKey({
      columns: [table.occurrenceId, table.accountId],
      foreignColumns: [missionOccurrences.id, missionOccurrences.accountId],
      name: 'mission_reward_basis_occurrence_account_fk',
    }).onDelete('cascade'),
    check(
      'mission_reward_basis_difficulty_check',
      sql\`${'${table.difficulty}'} is null or ${'${table.difficulty}'} in ('easy', 'normal', 'hard')\`,
    ),
    check('mission_reward_basis_base_xp_check', sql\`${'${table.baseXp}'} between 0 and 250\`),
    check(
      'mission_reward_basis_state_check',
      sql\`(${'${table.difficulty}'} is not null and ${'${table.baseXp}'} > 0 and ${'${table.revokedAt}'} is null) or (${'${table.baseXp}'} = 0 and ${'${table.revokedAt}'} is not null)\`,
    ),
  ],
);

`;
            schema = schema.replace(tableMarker, block + tableMarker);
          }
          if (!schema.includes('  missionRewardBasis,\n')) {
            if (schema.split(coreMarker).length !== 2) throw new Error('core table marker mismatch');
            schema = schema.replace(coreMarker, '  missionOccurrences,\n  missionRewardBasis,\n  missionOccurrenceTombstones,');
          }
          fs.writeFileSync(schemaPath, schema);

          const wrapperPath = 'packages/database/src/reward-basis-schema.ts';
          fs.writeFileSync(wrapperPath, "export { missionRewardBasis } from './schema.js';\n");

          const testPath = 'packages/database/src/schema.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const testMarker = "  'mission_occurrences',\n  'mission_occurrence_tombstones',";
          if (!test.includes("  'mission_reward_basis',\n")) {
            if (test.split(testMarker).length !== 2) throw new Error('schema test marker mismatch');
            test = test.replace(
              testMarker,
              "  'mission_occurrences',\n  'mission_reward_basis',\n  'mission_occurrence_tombstones',",
            );
          }
          fs.writeFileSync(testPath, test);
          NODE

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Format patched schema files
        run: >-
          pnpm exec prettier
          packages/database/src/schema.ts
          packages/database/src/schema.test.ts
          packages/database/src/reward-basis-schema.ts
          --write --config packages/config/prettier.config.mjs

      - name: Commit schema alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/schema.ts packages/database/src/schema.test.ts packages/database/src/reward-basis-schema.ts
          if git diff --cached --quiet; then
            echo "Schema already aligned"
            exit 0
          fi
          git commit -m "fix(mts-057): align reward basis schema inventory"
          git push origin HEAD:${{ github.head_ref }}
