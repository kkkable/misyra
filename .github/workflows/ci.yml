name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: mts056-red-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-red-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout MTS-056 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format RED tests and restore CI
        run: |
          pnpm exec prettier --write \
            apps/api/src/ai-difficulty-classification.test.ts \
            packages/contracts/src/ai-difficulty-classification.test.ts \
            --config packages/config/prettier.config.mjs
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "Misyra CI Helper"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/ai-difficulty-classification.test.ts \
            packages/contracts/src/ai-difficulty-classification.test.ts \
            .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 1
          fi
          git commit -m "test: format MTS-056 RED specs"
          git push origin HEAD:${{ github.head_ref }}
