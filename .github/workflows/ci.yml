name: CI

on:
  push:
    branches:
      - feat/mts-054-historical-state-transitions

permissions:
  contents: write

jobs:
  format-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout MTS-054 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-054-historical-state-transitions
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format only MTS-054 RED tests
        run: >-
          pnpm exec prettier --write
          apps/mobile/src/calendar/calendar-historical-state.test.mjs
          apps/mobile/src/calendar/calendar-mission-details-save.test.mjs
          --config packages/config/prettier.config.mjs

      - name: Restore CI workflow and commit formatted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml \
            apps/mobile/src/calendar/calendar-historical-state.test.mjs \
            apps/mobile/src/calendar/calendar-mission-details-save.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: apply Prettier to MTS-054 RED tests"
          git push origin HEAD:feat/mts-054-historical-state-transitions
