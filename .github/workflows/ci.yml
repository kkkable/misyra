name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTS004_INTEGRATION: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      CI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Bicep compiler in runner only
        run: az bicep install

      - name: Start deterministic local dependencies
        run: docker compose --file compose.yaml up -d --wait postgres azurite

      - name: Prove failing-fixture gates reject bad inputs
        run: pnpm ci:fixtures

      - name: Check workspace formatting
        run: pnpm format

      - name: Check CI-owned formatting
        run: pnpm format:ci

      - name: Lint workspaces
        run: pnpm lint

      - name: Lint CI-owned scripts and tests
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Diagnose unchanged calendar tests
        continue-on-error: true
        run: >-
          pnpm --filter @misyra/mobile exec vitest run --config ../../packages/config/vitest.config.mjs
          src/calendar/calendar-all-day.test.mjs
          src/calendar/calendar-day-screen.test.mjs
          src/calendar/calendar-day-shell.test.mjs
          src/calendar/calendar-help-focus.test.mjs
          src/calendar/calendar-help-sheet.test.mjs
          src/calendar/calendar-language-runtime.test.mjs
          src/calendar/calendar-locale-time-audit.test.mjs
          src/calendar/calendar-mission-adjustment-feedback.test.mjs
          src/calendar/calendar-mission-adjustment-save.test.mjs
          src/calendar/calendar-mission-adjustment.test.mjs
          src/calendar/calendar-mission-delete-duplicate.test.mjs
          src/calendar/calendar-mission-details.test.mjs
          src/calendar/calendar-mission-form-ui.test.mjs
          src/calendar/calendar-mission-form.test.mjs
          src/calendar/calendar-mission-gesture-runtime.test.mjs
          src/calendar/calendar-mission-gesture.test.mjs
          src/calendar/calendar-mission-layout.test.mjs
          src/calendar/calendar-recurrence-editor.test.mjs
          src/calendar/calendar-route-search.test.mjs
          src/calendar/calendar-search-focus.test.mjs
          src/calendar/calendar-timeline.test.mjs

      - name: Diagnose unchanged UI and lifecycle tests
        continue-on-error: true
        run: >-
          pnpm --filter @misyra/mobile exec vitest run --config ../../packages/config/vitest.config.mjs
          src/auth/auth-api.test.mjs
          src/auth/auth-messages.test.mjs
          src/auth/auth-session.test.mjs
          src/auth/root-auth-gate.test.mjs
          src/auth/secure-session-storage.test.mjs
          src/auth/session-lifecycle.test.mjs
          src/auth/session-refresh-offline.review.test.mjs
          src/auth/sign-in-screen.test.mjs
          src/auth/sign-out-cleanup.test.mjs
          src/design-system/contracts.test.ts
          src/design-system/primitives.component.test.mjs
          src/experience/motion-haptics.test.mjs
          src/navigation/navigation-shell.test.mjs
          src/onboarding/onboarding-flow.test.mjs
          src/onboarding/onboarding-screen.test.mjs
          src/onboarding/root-onboarding-gate.test.mjs

      - name: Diagnose unchanged search and storage tests
        continue-on-error: true
        run: >-
          pnpm --filter @misyra/mobile exec vitest run --config ../../packages/config/vitest.config.mjs
          src/search/calendar-search-navigation.test.mjs
          src/search/calendar-search-screen.test.mjs
          src/search/offline-search.test.mjs
          src/storage/local-repositories.review-corrections.test.mjs
          src/storage/local-repositories.review.test.mjs
          src/storage/local-repositories.story-deletion.test.mjs
          src/storage/local-repositories.test.mjs
          src/storage/mutation-queue.contract.test.mjs
          src/storage/mutation-queue.test.mjs
          src/storage/schema.test.mjs

      - name: Diagnose unchanged sync tests
        continue-on-error: true
        run: >-
          pnpm --filter @misyra/mobile exec vitest run --config ../../packages/config/vitest.config.mjs
          src/sync/authenticated-sync-mission-delete.test.mjs
          src/sync/authenticated-sync-recurrence.test.mjs
          src/sync/authenticated-sync-runtime.test.mjs
          src/sync/conflict-application.test.mjs
          src/sync/root-sync-runtime.test.mjs
          src/sync/server-sync-conflicts.review.test.mjs
          src/sync/server-sync-order.test.mjs
          src/sync/server-sync.test.mjs
          src/sync/sync-runtime-lifecycle.review.test.mjs
          src/sync/sync-session-provider.review.test.mjs

      - name: Run unit, integration, and mobile component tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Reject high and critical dependency findings
        run: pnpm audit --audit-level high

      - name: Scan tracked implementation and configuration for secrets
        run: pnpm ci:secrets

      - name: Verify localization completeness
        run: pnpm ci:localization

      - name: Verify privacy and logging boundaries
        run: pnpm ci:privacy

      - name: Compile Bicep and environment parameter shapes
        run: pnpm validate:infra

      - name: Verify contract compatibility boundary
        run: pnpm ci:contracts

      - name: Stop local dependencies
        if: always()
        run: docker compose --file compose.yaml down --volumes
