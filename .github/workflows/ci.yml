name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-mts052-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MTS-052 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-052-recurring-scope-flows
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply guarded GREEN integration and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('packages/localization/src/catalogs.ts')
          text = path.read_text()
          text = replace_once(text, "    'calendar.details.delete': 'Delete',\n", "    'calendar.details.delete': 'Delete',\n    'calendar.recurringScope.editTitle': 'Edit repeating mission',\n    'calendar.recurringScope.deleteTitle': 'Delete repeating mission',\n    'calendar.recurringScope.restoreTitle': 'Restore repeating event',\n    'calendar.recurringScope.thisOccurrence': 'This occurrence',\n    'calendar.recurringScope.thisAndFuture': 'This and future occurrences',\n    'calendar.recurringScope.entireSeries': 'Entire series',\n    'calendar.recurringScope.cancel': 'Cancel',\n", 'English scope catalog')
          text = replace_once(text, "    'calendar.details.delete': '刪除',\n", "    'calendar.details.delete': '刪除',\n    'calendar.recurringScope.editTitle': '編輯重複任務',\n    'calendar.recurringScope.deleteTitle': '刪除重複任務',\n    'calendar.recurringScope.restoreTitle': '還原重複行程',\n    'calendar.recurringScope.thisOccurrence': '只限今次',\n    'calendar.recurringScope.thisAndFuture': '今次及之後',\n    'calendar.recurringScope.entireSeries': '整個系列',\n    'calendar.recurringScope.cancel': '取消',\n", 'zh-HK scope catalog')
          path.write_text(text)

          path = Path('apps/mobile/src/calendar/calendar-mission-details.tsx')
          text = path.read_text()
          text = replace_once(text, "import { Pressable, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';\n", "import { useState } from 'react';\nimport { Pressable, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';\n", 'details React state import')
          text = replace_once(text, "  RewardEligibility,\n} from '@misyra/domain';", "  RewardEligibility,\n  RecurringSeriesScope,\n} from '@misyra/domain';", 'details domain scope type')
          text = replace_once(text, "import { fieldContract, themeColors, type ColorScheme } from '../design-system/index.js';\n", "import { fieldContract, themeColors, type ColorScheme } from '../design-system/index.js';\nimport {\n  CalendarRecurringScopeChooser,\n  type CalendarRecurringScopeOperation,\n} from './calendar-recurring-scope-chooser.js';\n\nexport { CalendarRecurringScopeChooser } from './calendar-recurring-scope-chooser.js';\n", 'details chooser import')
          text = replace_once(text, "  readonly onSave?: (() => void | Promise<void>) | undefined;\n  readonly onDuplicate?: ((missionId: string) => void | Promise<void>) | undefined;\n  readonly onDelete?: ((missionId: string) => void | Promise<void>) | undefined;", "  readonly onSave?: ((scope?: RecurringSeriesScope) => void | Promise<void>) | undefined;\n  readonly onDuplicate?: ((missionId: string) => void | Promise<void>) | undefined;\n  readonly onDelete?:\n    | ((missionId: string, scope?: RecurringSeriesScope) => void | Promise<void>)\n    | undefined;", 'details callback types')
          text = replace_once(text, "  const colors = themeColors(colorScheme);\n  const historical = isHistorical(details.lifecycle) || details.completionState === 'completed';", "  const colors = themeColors(colorScheme);\n  const [scopeOperation, setScopeOperation] = useState<CalendarRecurringScopeOperation | null>(null);\n  const historical = isHistorical(details.lifecycle) || details.completionState === 'completed';", 'details chooser state')
          text = replace_once(text, "  const structuredEditable =\n    appOwnedEditable && details.structuredSchedule !== undefined && details.recurring !== true;", "  const structuredEditable = appOwnedEditable && details.structuredSchedule !== undefined;", 'details structured editability')
          count = text.count("editable={appOwnedEditable && details.recurring !== true}")
          if count != 3:
              raise SystemExit(f'details recurring editability: expected 3 matches, found {count}')
          text = text.replace("editable={appOwnedEditable && details.recurring !== true}", "editable={appOwnedEditable}")
          text = replace_once(text, "          onPress={() => {\n            void Promise.resolve(onSave()).catch(() => undefined);\n          }}", "          onPress={() => {\n            if (details.recurring === true) {\n              setScopeOperation('edit');\n              return;\n            }\n            void Promise.resolve(onSave()).catch(() => undefined);\n          }}", 'details scoped save action')
          text = replace_once(text, "              onPress={() => {\n                void Promise.resolve(onDelete(details.id)).catch(() => undefined);\n              }}", "              onPress={() => {\n                if (details.recurring === true) {\n                  setScopeOperation('delete');\n                  return;\n                }\n                void Promise.resolve(onDelete(details.id)).catch(() => undefined);\n              }}", 'details scoped delete action')
          text = replace_once(text, "      )}\n    </ScrollView>", "      )}\n\n      {scopeOperation === null ? null : (\n        <CalendarRecurringScopeChooser\n          colorScheme={colorScheme}\n          language={language}\n          onCancel={() => {\n            setScopeOperation(null);\n          }}\n          onSelect={(scope) => {\n            const operation = scopeOperation;\n            setScopeOperation(null);\n            if (operation === 'edit' && onSave !== undefined) {\n              void Promise.resolve(onSave(scope)).catch(() => undefined);\n            } else if (operation === 'delete' && onDelete !== undefined) {\n              void Promise.resolve(onDelete(details.id, scope)).catch(() => undefined);\n            }\n          }}\n          operation={scopeOperation}\n        />\n      )}\n    </ScrollView>", 'details chooser render')
          path.write_text(text)

          path = Path('apps/mobile/src/calendar/calendar-mission-details-route.tsx')
          text = path.read_text()
          text = replace_once(text, "import { layout, space, typography } from '@misyra/design-tokens';\nimport { localizationCatalogs } from '@misyra/localization';", "import { layout, space, typography } from '@misyra/design-tokens';\nimport type { RecurringSeriesScope } from '@misyra/domain';\nimport { localizationCatalogs } from '@misyra/localization';", 'route scope type import')
          text = replace_once(text, "  const saveDetails = useCallback(async () => {\n    if (details === null || details.structuredSchedule === undefined || details.recurring === true)\n      return;", "  const saveDetails = useCallback(async (scope?: RecurringSeriesScope) => {\n    if (details === null || details.structuredSchedule === undefined) return;", 'route scoped save signature')
          text = replace_once(text, "      now: new Date(),\n      generateId: generateUuid,\n    });\n    setLoaded(false);", "      scope,\n      now: new Date(),\n      generateId: generateUuid,\n      generateSeriesId: generateUuid,\n    });\n    setLoaded(false);", 'route scoped save options')
          text = replace_once(text, "    async (targetMissionId: string) => {", "    async (targetMissionId: string, scope?: RecurringSeriesScope) => {", 'route scoped delete signature')
          text = replace_once(text, "        occurrenceId: targetMissionId,\n        now: new Date(),\n        generateId: generateUuid,\n      });", "        occurrenceId: targetMissionId,\n        scope,\n        now: new Date(),\n        generateId: generateUuid,\n      });", 'route scoped delete options')
          path.write_text(text)

          path = Path('packages/database/src/sync-store.ts')
          text = path.read_text()
          old_types = base64.b64decode('').decode()
          new_types = base64.b64decode('').decode()
          text = replace_once(text, old_types, new_types, 'sync update types')
          parser_pattern = re.compile(r"function parseMissionUpdatePayload\(payload: unknown\): MissionUpdatePayload \{.*?\n\}\n\nfunction enforceMissionCreatePlacement", re.S)
          if len(parser_pattern.findall(text)) != 1:
              raise SystemExit('sync parser: expected exactly one function')
          new_parser = base64.b64decode('').decode()
          text = parser_pattern.sub(lambda _: new_parser, text, count=1)
          apply_pattern = re.compile(r"async function applyMissionUpdateMutation\(.*?\n\}\n\nasync function applyMissionDeleteMutation", re.S)
          if len(apply_pattern.findall(text)) != 1:
              raise SystemExit('sync projector: expected exactly one function')
          new_apply = base64.b64decode('').decode()
          text = apply_pattern.sub(lambda _: new_apply, text, count=1)
          path.write_text(text)

          for filename in ['apps/mobile/src/calendar/calendar-mission-adjustment-save.ts', 'apps/mobile/src/calendar/calendar-mission-details-save.ts']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace("...(targetSeries.id === sourceSeries.id ? {} : { series: targetSeries }),", "...(recurring ? { series: targetSeries } : {}),")
              text = text.replace("...(targetSeries.id === currentSeries.id ? {} : { series: targetSeries }),", "...(recurring ? { series: targetSeries } : {}),")
              path.write_text(text)
          PY

          pnpm exec prettier --write packages/localization/src/catalogs.ts packages/database/src/sync-store.ts apps/mobile/src/calendar/calendar-recurring-scope-chooser.tsx apps/mobile/src/calendar/calendar-mission-details.tsx apps/mobile/src/calendar/calendar-mission-details-route.tsx apps/mobile/src/calendar/calendar-mission-details-save.ts apps/mobile/src/calendar/calendar-mission-adjustment-save.ts apps/mobile/src/calendar/calendar-mission-delete.ts --config packages/config/prettier.config.mjs
          git show origin/main:.github/workflows/ci.yml > /tmp/ci-main.yml
          cp /tmp/ci-main.yml .github/workflows/ci.yml
          cmp -s .github/workflows/ci.yml /tmp/ci-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/localization/src/catalogs.ts packages/database/src/sync-store.ts apps/mobile/src/calendar/calendar-recurring-scope-chooser.tsx apps/mobile/src/calendar/calendar-mission-details.tsx apps/mobile/src/calendar/calendar-mission-details-route.tsx apps/mobile/src/calendar/calendar-mission-details-save.ts apps/mobile/src/calendar/calendar-mission-adjustment-save.ts apps/mobile/src/calendar/calendar-mission-delete.ts .github/workflows/ci.yml
          git commit -m 'feat: wire recurring scope flows end to end'
          git push origin HEAD:feat/mts-052-recurring-scope-flows
