name: CI

on:
  pull_request:
  push:
    branches:
      - feat/mts-053-app-time-zone-travel

permissions:
  contents: write

concurrency:
  group: ci-mts053-red-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-red-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format RED fixture and restore standard CI
        run: |
          pnpm exec prettier --write packages/database/src/device-settings-time-zone.test.ts --config packages/config/prettier.config.mjs
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/device-settings-time-zone.test.ts .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: format MTS-053 RED fixture"
          git push origin HEAD:feat/mts-053-app-time-zone-travel
