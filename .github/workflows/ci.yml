name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-corrective-files:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/mts-044-051-cross-ticket-corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format corrective files and restore CI
        run: |
          pnpm exec prettier --write \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-screen.test.mjs \
            --config packages/config/prettier.config.mjs
          git checkout origin/${{ github.event.pull_request.base.ref }} -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-screen.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format mission selection corrections"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTS004_INTEGRATION: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      CI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Bicep compiler in runner only
        run: az bicep install

      - name: Start deterministic local dependencies
        run: docker compose --file compose.yaml up -d --wait postgres azurite

      - name: Prove failing-fixture gates reject bad inputs
        run: pnpm ci:fixtures

      - name: Check workspace formatting
        run: pnpm format

      - name: Check CI-owned formatting
        run: pnpm format:ci

      - name: Lint workspaces
        run: pnpm lint

      - name: Lint CI-owned scripts and tests
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit, integration, and mobile component tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Reject high and critical dependency findings
        run: pnpm audit --audit-level high

      - name: Scan tracked implementation and configuration for secrets
        run: pnpm ci:secrets

      - name: Verify localization completeness
        run: pnpm ci:localization

      - name: Verify privacy and logging boundaries
        run: pnpm ci:privacy

      - name: Compile Bicep and environment parameter shapes
        run: pnpm validate:infra

      - name: Verify contract compatibility boundary
        run: pnpm ci:contracts

      - name: Stop local dependencies
        if: always()
        run: docker compose --file compose.yaml down --volumes
