name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-mts052-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MTS-052 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-052-recurring-scope-flows
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply guarded GREEN integration and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          # Localization: all user-visible scope copy belongs in the shared catalogs.
          path = Path('packages/localization/src/catalogs.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "    'calendar.details.delete': 'Delete',\n",
              "    'calendar.details.delete': 'Delete',\n"
              "    'calendar.recurringScope.editTitle': 'Edit repeating mission',\n"
              "    'calendar.recurringScope.deleteTitle': 'Delete repeating mission',\n"
              "    'calendar.recurringScope.restoreTitle': 'Restore repeating event',\n"
              "    'calendar.recurringScope.thisOccurrence': 'This occurrence',\n"
              "    'calendar.recurringScope.thisAndFuture': 'This and future occurrences',\n"
              "    'calendar.recurringScope.entireSeries': 'Entire series',\n"
              "    'calendar.recurringScope.cancel': 'Cancel',\n",
              'English scope catalog',
          )
          text = replace_once(
              text,
              "    'calendar.details.delete': '刪除',\n",
              "    'calendar.details.delete': '刪除',\n"
              "    'calendar.recurringScope.editTitle': '編輯重複任務',\n"
              "    'calendar.recurringScope.deleteTitle': '刪除重複任務',\n"
              "    'calendar.recurringScope.restoreTitle': '還原重複行程',\n"
              "    'calendar.recurringScope.thisOccurrence': '只限今次',\n"
              "    'calendar.recurringScope.thisAndFuture': '今次及之後',\n"
              "    'calendar.recurringScope.entireSeries': '整個系列',\n"
              "    'calendar.recurringScope.cancel': '取消',\n",
              'zh-HK scope catalog',
          )
          path.write_text(text)

          # Mission Details: recurring fields remain editable; Save/Delete require explicit scope.
          path = Path('apps/mobile/src/calendar/calendar-mission-details.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "import { Pressable, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';\n",
              "import { useState } from 'react';\nimport { Pressable, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';\n",
              'details React state import',
          )
          text = replace_once(
              text,
              "  RewardEligibility,\n} from '@misyra/domain';",
              "  RewardEligibility,\n  RecurringSeriesScope,\n} from '@misyra/domain';",
              'details domain scope type',
          )
          text = replace_once(
              text,
              "import { fieldContract, themeColors, type ColorScheme } from '../design-system/index.js';\n",
              "import { fieldContract, themeColors, type ColorScheme } from '../design-system/index.js';\nimport {\n  CalendarRecurringScopeChooser,\n  type CalendarRecurringScopeOperation,\n} from './calendar-recurring-scope-chooser.js';\n\nexport { CalendarRecurringScopeChooser } from './calendar-recurring-scope-chooser.js';\n",
              'details chooser import',
          )
          text = replace_once(
              text,
              "  readonly onSave?: (() => void | Promise<void>) | undefined;\n  readonly onDuplicate?: ((missionId: string) => void | Promise<void>) | undefined;\n  readonly onDelete?: ((missionId: string) => void | Promise<void>) | undefined;",
              "  readonly onSave?: ((scope?: RecurringSeriesScope) => void | Promise<void>) | undefined;\n  readonly onDuplicate?: ((missionId: string) => void | Promise<void>) | undefined;\n  readonly onDelete?:\n    | ((missionId: string, scope?: RecurringSeriesScope) => void | Promise<void>)\n    | undefined;",
              'details callback types',
          )
          text = replace_once(
              text,
              "  const colors = themeColors(colorScheme);\n  const historical = isHistorical(details.lifecycle) || details.completionState === 'completed';",
              "  const colors = themeColors(colorScheme);\n  const [scopeOperation, setScopeOperation] = useState<CalendarRecurringScopeOperation | null>(null);\n  const historical = isHistorical(details.lifecycle) || details.completionState === 'completed';",
              'details chooser state',
          )
          text = replace_once(
              text,
              "  const structuredEditable =\n    appOwnedEditable && details.structuredSchedule !== undefined && details.recurring !== true;",
              "  const structuredEditable = appOwnedEditable && details.structuredSchedule !== undefined;",
              'details structured editability',
          )
          text = text.replace("editable={appOwnedEditable && details.recurring !== true}", "editable={appOwnedEditable}")
          text = replace_once(
              text,
              "          onPress={() => {\n            void Promise.resolve(onSave()).catch(() => undefined);\n          }}",
              "          onPress={() => {\n            if (details.recurring === true) {\n              setScopeOperation('edit');\n              return;\n            }\n            void Promise.resolve(onSave()).catch(() => undefined);\n          }}",
              'details scoped save action',
          )
          text = replace_once(
              text,
              "              onPress={() => {\n                void Promise.resolve(onDelete(details.id)).catch(() => undefined);\n              }}",
              "              onPress={() => {\n                if (details.recurring === true) {\n                  setScopeOperation('delete');\n                  return;\n                }\n                void Promise.resolve(onDelete(details.id)).catch(() => undefined);\n              }}",
              'details scoped delete action',
          )
          text = replace_once(
              text,
              "      )}\n    </ScrollView>",
              "      )}\n\n      {scopeOperation === null ? null : (\n        <CalendarRecurringScopeChooser\n          colorScheme={colorScheme}\n          language={language}\n          onCancel={() => {\n            setScopeOperation(null);\n          }}\n          onSelect={(scope) => {\n            const operation = scopeOperation;\n            setScopeOperation(null);\n            if (operation === 'edit' && onSave !== undefined) {\n              void Promise.resolve(onSave(scope)).catch(() => undefined);\n            } else if (operation === 'delete' && onDelete !== undefined) {\n              void Promise.resolve(onDelete(details.id, scope)).catch(() => undefined);\n            }\n          }}\n          operation={scopeOperation}\n        />\n      )}\n    </ScrollView>",
              'details chooser render',
          )
          path.write_text(text)

          # Mission Details route forwards the explicit scope into local-first persistence.
          path = Path('apps/mobile/src/calendar/calendar-mission-details-route.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "import { layout, space, typography } from '@misyra/design-tokens';\nimport { localizationCatalogs } from '@misyra/localization';",
              "import { layout, space, typography } from '@misyra/design-tokens';\nimport type { RecurringSeriesScope } from '@misyra/domain';\nimport { localizationCatalogs } from '@misyra/localization';",
              'route scope type import',
          )
          text = replace_once(
              text,
              "  const saveDetails = useCallback(async () => {\n    if (details === null || details.structuredSchedule === undefined || details.recurring === true)\n      return;",
              "  const saveDetails = useCallback(async (scope?: RecurringSeriesScope) => {\n    if (details === null || details.structuredSchedule === undefined) return;",
              'route scoped save signature',
          )
          text = replace_once(
              text,
              "      now: new Date(),\n      generateId: generateUuid,\n    });\n    setLoaded(false);",
              "      scope,\n      now: new Date(),\n      generateId: generateUuid,\n      generateSeriesId: generateUuid,\n    });\n    setLoaded(false);",
              'route scoped save options',
          )
          text = replace_once(
              text,
              "    async (targetMissionId: string) => {",
              "    async (targetMissionId: string, scope?: RecurringSeriesScope) => {",
              'route scoped delete signature',
          )
          delete_anchor = "        occurrenceId: targetMissionId,\n        now: new Date(),\n        generateId: generateUuid,\n      });"
          text = replace_once(
              text,
              delete_anchor,
              "        occurrenceId: targetMissionId,\n        scope,\n        now: new Date(),\n        generateId: generateUuid,\n      });",
              'route scoped delete options',
          )
          path.write_text(text)

          # Server sync: parse scoped series metadata and project split/reparent updates.
          path = Path('packages/database/src/sync-store.ts')
          text = path.read_text()
          old_types = """type MissionAdjustmentUpdatePayload = Readonly<{\n  kind: 'adjustment';\n  schedule: MissionSchedulePayload & Readonly<{ allDay: false; estimatedEffortMinutes: null }>;\n  rewardEligibility: 'eligible' | 'ineligible';\n}>;\n\ntype MissionDetailsUpdatePayload = Readonly<{\n  kind: 'details';\n  title: string;\n  schedule: MissionSchedulePayload;\n  rewardEligibility: 'eligible' | 'ineligible';\n  location: string | null;\n  notes: string | null;\n}>;\n\ntype MissionUpdatePayload = MissionAdjustmentUpdatePayload | MissionDetailsUpdatePayload;"""
          new_types = """type MissionUpdateSeries = MissionCreatePayload['series'];\n\ntype MissionSourceSeriesUpdate = Readonly<{\n  id: string;\n  recurrence: Record<string, unknown> | null;\n}>;\n\ntype MissionScopedUpdateMetadata = Readonly<{\n  series?: MissionUpdateSeries | undefined;\n  sourceSeries?: MissionSourceSeriesUpdate | undefined;\n}>;\n\ntype MissionAdjustmentUpdatePayload = Readonly<{\n  kind: 'adjustment';\n  schedule: MissionSchedulePayload & Readonly<{ allDay: false; estimatedEffortMinutes: null }>;\n  rewardEligibility: 'eligible' | 'ineligible';\n}> &\n  MissionScopedUpdateMetadata;\n\ntype MissionDetailsUpdatePayload = Readonly<{\n  kind: 'details';\n  title: string;\n  schedule: MissionSchedulePayload;\n  rewardEligibility: 'eligible' | 'ineligible';\n  location: string | null;\n  notes: string | null;\n}> &\n  MissionScopedUpdateMetadata;\n\ntype MissionUpdatePayload = MissionAdjustmentUpdatePayload | MissionDetailsUpdatePayload;"""
          text = replace_once(text, old_types, new_types, 'sync update types')

          old_parser_pattern = re.compile(r"function parseMissionUpdatePayload\(payload: unknown\): MissionUpdatePayload \{.*?\n\}\n\nfunction enforceMissionCreatePlacement", re.S)
          if len(old_parser_pattern.findall(text)) != 1:
              raise SystemExit('sync parser: expected exactly one function')
          new_parser = r"""function parseMissionUpdateSeries(value: unknown): MissionUpdateSeries {\n  const source = asRecord(value, 'Mission target series');\n  const keys = Object.keys(source);\n  const supported = new Set(['id', 'title', 'recurrence']);\n  if (keys.length !== supported.size || keys.some((key) => !supported.has(key))) {\n    throw new SyncMutationValidationError('Mission target series contains unsupported fields');\n  }\n  return {\n    id: requireUuid(source, 'id', 'Mission target series id'),\n    title: requireString(source, 'title', 'Mission target series title').trim(),\n    recurrence: optionalObject(source, 'recurrence', 'Mission target series recurrence'),\n  };\n}\n\nfunction parseMissionSourceSeries(value: unknown): MissionSourceSeriesUpdate {\n  const source = asRecord(value, 'Mission source series');\n  const keys = Object.keys(source);\n  if (keys.length !== 2 || keys.some((key) => key !== 'id' && key !== 'recurrence')) {\n    throw new SyncMutationValidationError('Mission source series contains unsupported fields');\n  }\n  return {\n    id: requireUuid(source, 'id', 'Mission source series id'),\n    recurrence: optionalObject(source, 'recurrence', 'Mission source series recurrence'),\n  };\n}\n\nfunction parseMissionScopedUpdateMetadata(root: Record<string, unknown>): MissionScopedUpdateMetadata {\n  const series = Object.hasOwn(root, 'series') ? parseMissionUpdateSeries(root.series) : undefined;\n  const sourceSeries = Object.hasOwn(root, 'sourceSeries')\n    ? parseMissionSourceSeries(root.sourceSeries)\n    : undefined;\n  if (sourceSeries !== undefined && series === undefined) {\n    throw new SyncMutationValidationError('Mission source series update requires a target series');\n  }\n  return {\n    ...(series === undefined ? {} : { series }),\n    ...(sourceSeries === undefined ? {} : { sourceSeries }),\n  };\n}\n\nfunction parseMissionUpdatePayload(payload: unknown): MissionUpdatePayload {\n  const root = asRecord(payload, 'Mission update payload');\n  if (root.kind === 'details') {\n    const keys = Object.keys(root);\n    const supported = new Set([\n      'kind',\n      'title',\n      'schedule',\n      'rewardEligibility',\n      'location',\n      'notes',\n      'series',\n      'sourceSeries',\n    ]);\n    const required = ['kind', 'title', 'schedule', 'rewardEligibility', 'location', 'notes'];\n    if (\n      keys.some((key) => !supported.has(key)) ||\n      required.some((key) => !Object.hasOwn(root, key))\n    ) {\n      throw new SyncMutationValidationError('Mission Details update contains unsupported fields');\n    }\n    return {\n      kind: 'details',\n      title: requireString(root, 'title', 'Mission title').trim(),\n      schedule: parseMissionSchedule(asRecord(root.schedule, 'Mission update schedule')),\n      rewardEligibility: requireLiteral(\n        root,\n        'rewardEligibility',\n        ['eligible', 'ineligible'] as const,\n        'Mission reward eligibility',\n      ),\n      location: optionalString(root, 'location', 'Mission location'),\n      notes: optionalString(root, 'notes', 'Mission notes'),\n      ...parseMissionScopedUpdateMetadata(root),\n    };\n  }\n\n  const keys = Object.keys(root);\n  const supported = new Set(['schedule', 'rewardEligibility', 'series', 'sourceSeries']);\n  if (\n    keys.some((key) => !supported.has(key)) ||\n    !Object.hasOwn(root, 'schedule') ||\n    !Object.hasOwn(root, 'rewardEligibility')\n  ) {\n    throw new SyncMutationValidationError('Mission update contains unsupported fields');\n  }\n  const schedule = parseMissionSchedule(asRecord(root.schedule, 'Mission update schedule'));\n  if (schedule.allDay) {\n    throw new SyncMutationValidationError(\n      'MTS-047 direct manipulation supports timed missions only',\n    );\n  }\n  return {\n    kind: 'adjustment',\n    schedule,\n    rewardEligibility: requireLiteral(\n      root,\n      'rewardEligibility',\n      ['eligible', 'ineligible'] as const,\n      'Mission reward eligibility',\n    ),\n    ...parseMissionScopedUpdateMetadata(root),\n  };\n}\n\nfunction enforceMissionCreatePlacement"""
          text = old_parser_pattern.sub(lambda _: new_parser, text, count=1)

          apply_pattern = re.compile(r"async function applyMissionUpdateMutation\(.*?\n\}\n\nasync function applyMissionDeleteMutation", re.S)
          if len(apply_pattern.findall(text)) != 1:
              raise SystemExit('sync projector: expected exactly one function')
          new_apply = r"""async function applyMissionUpdateMutation(\n  client: PoolClient,\n  mutation: StoredSyncMutation,\n  effectiveTime: Date,\n): Promise<unknown> {\n  if (mutation.baseVersion === null) {\n    throw new SyncMutationValidationError('Mission update requires a base version');\n  }\n  const update = parseMissionUpdatePayload(mutation.payload);\n  const currentResult = await client.query<MissionUpdateRow>(\n    `SELECT o.series_id AS \"seriesId\",\n            s.title,\n            s.recurrence_rule AS recurrence,\n            o.schedule_state AS \"scheduleState\",\n            o.completion_state AS \"completionState\",\n            o.evidence_state AS \"evidenceState\",\n            o.reward_eligibility AS \"rewardEligibility\",\n            o.reward_issuance AS \"rewardIssuance\",\n            o.calendar_source AS \"calendarSource\",\n            o.field_ownership AS \"fieldOwnership\",\n            o.story_state AS \"storyState\",\n            o.deletion_state AS \"deletionState\",\n            o.all_day AS \"allDay\",\n            o.start_instant AS \"startInstant\",\n            o.location,\n            o.notes,\n            o.version\n       FROM mission_occurrences o\n       JOIN mission_series s ON s.id = o.series_id AND s.account_id = o.account_id\n      WHERE o.id = $1 AND o.account_id = $2\n      FOR UPDATE OF o`,\n    [mutation.entityId, mutation.accountId],\n  );\n  const current = currentResult.rows[0];\n  if (current === undefined) {\n    throw new SyncMutationValidationError('Mission update target was not found');\n  }\n  if (current.deletionState === 'deleted') {\n    throw new SyncMutationConflictError('Mission occurrence is permanently deleted');\n  }\n  if (current.version !== mutation.baseVersion) {\n    throw new SyncMutationConflictError(\n      'Mission mutation base version does not match current occurrence version',\n    );\n  }\n  if (\n    current.scheduleState !== 'scheduled' ||\n    current.completionState !== 'incomplete' ||\n    current.calendarSource !== 'internal' ||\n    current.fieldOwnership !== 'app_owned' ||\n    current.deletionState !== 'active'\n  ) {\n    throw new SyncMutationValidationError(\n      'Mission edits require an active unfinished app-owned mission',\n    );\n  }\n  if (update.kind === 'adjustment' && current.allDay) {\n    throw new SyncMutationValidationError(\n      'Mission direct manipulation requires an active unfinished app-owned timed mission',\n    );\n  }\n  const scoped = update.series !== undefined;\n  if (update.kind === 'details' && current.recurrence !== null && !scoped) {\n    throw new SyncMutationValidationError(\n      'Recurring Mission Details edits require recurrence scope selection',\n    );\n  }\n  if (update.kind === 'details' && update.schedule.allDay !== current.allDay) {\n    throw new SyncMutationValidationError('Mission Details cannot change the all-day mode');\n  }\n  if (update.sourceSeries !== undefined && update.sourceSeries.id !== current.seriesId) {\n    throw new SyncMutationValidationError('Mission source series must match the current series');\n  }\n\n  const editedAfterStart = Date.parse(current.startInstant) <= effectiveTime.getTime();\n  const movedIntoPast = Date.parse(update.schedule.startInstant) < effectiveTime.getTime();\n  const rewardEligibility =\n    current.rewardEligibility === 'ineligible' ||\n    update.rewardEligibility === 'ineligible' ||\n    editedAfterStart ||\n    movedIntoPast\n      ? 'ineligible'\n      : update.rewardEligibility;\n  const nextVersion = current.version + 1;\n  const schedule = update.schedule;\n  const title = update.kind === 'details' ? update.title : current.title;\n  const location = update.kind === 'details' ? update.location : current.location;\n  const notes = update.kind === 'details' ? update.notes : current.notes;\n  const targetSeries: MissionUpdateSeries = update.series ?? {\n    id: current.seriesId,\n    title,\n    recurrence: current.recurrence as Record<string, unknown> | null,\n  };\n  if (update.kind === 'details' && targetSeries.title !== title) {\n    throw new SyncMutationValidationError('Mission target series title must match the details title');\n  }\n\n  if (update.sourceSeries !== undefined) {\n    const sourceUpdated = await client.query(\n      `UPDATE mission_series\n          SET recurrence_rule = $3::jsonb,\n              updated_at = now()\n        WHERE id = $1 AND account_id = $2`,\n      [\n        update.sourceSeries.id,\n        mutation.accountId,\n        update.sourceSeries.recurrence === null\n          ? null\n          : JSON.stringify(update.sourceSeries.recurrence),\n      ],\n    );\n    if (sourceUpdated.rowCount !== 1) {\n      throw new SyncMutationConflictError('Mission source series changed while scope was saved');\n    }\n  }\n\n  if (targetSeries.id !== current.seriesId) {\n    await upsertMissionSeries(client, mutation.accountId, targetSeries);\n  } else if (scoped) {\n    const recurrenceCheck = await client.query<{ matches: boolean }>(\n      `SELECT recurrence_rule IS NOT DISTINCT FROM $3::jsonb AS matches\n         FROM mission_series\n        WHERE id = $1 AND account_id = $2`,\n      [\n        targetSeries.id,\n        mutation.accountId,\n        targetSeries.recurrence === null ? null : JSON.stringify(targetSeries.recurrence),\n      ],\n    );\n    if (recurrenceCheck.rows[0]?.matches !== true) {\n      throw new SyncMutationConflictError('Mission target series recurrence does not match');\n    }\n  }\n\n  if (update.kind === 'details' && targetSeries.id === current.seriesId) {\n    const seriesUpdated = await client.query(\n      `UPDATE mission_series\n          SET title = $3,\n              updated_at = now()\n        WHERE id = $1 AND account_id = $2`,\n      [current.seriesId, mutation.accountId, title],\n    );\n    if (seriesUpdated.rowCount !== 1) {\n      throw new SyncMutationConflictError('Mission series changed while details were saved');\n    }\n  }\n\n  const updated = await client.query(\n    `UPDATE mission_occurrences\n        SET series_id = $3,\n            local_date = $4,\n            local_start = $5,\n            local_finish = $6,\n            start_instant = $7,\n            finish_instant = $8,\n            time_zone = $9,\n            time_behavior = $10,\n            all_day = $11,\n            estimated_effort_minutes = $12,\n            reward_eligibility = $13,\n            location = $14,\n            notes = $15,\n            synchronization_state = 'synced',\n            version = $16,\n            updated_at = now()\n      WHERE id = $1 AND account_id = $2 AND version = $17`,\n    [\n      mutation.entityId,\n      mutation.accountId,\n      targetSeries.id,\n      schedule.localStart.slice(0, 10),\n      schedule.localStart,\n      schedule.localFinish,\n      schedule.startInstant,\n      schedule.finishInstant,\n      schedule.timeZone,\n      schedule.timeBehavior,\n      schedule.allDay,\n      schedule.estimatedEffortMinutes,\n      rewardEligibility,\n      location,\n      notes,\n      nextVersion,\n      current.version,\n    ],\n  );\n  if (updated.rowCount !== 1) {\n    throw new SyncMutationConflictError(\n      'Mission mutation base version does not match current occurrence version',\n    );\n  }\n\n  return {\n    version: nextVersion,\n    series: targetSeries,\n    occurrence: {\n      id: mutation.entityId,\n      seriesId: targetSeries.id,\n      schedule,\n      scheduleState: current.scheduleState,\n      completionState: current.completionState,\n      evidenceState: current.evidenceState,\n      rewardEligibility,\n      rewardIssuance: current.rewardIssuance,\n      calendarSource: current.calendarSource,\n      fieldOwnership: current.fieldOwnership,\n      synchronizationState: 'synced',\n      storyState: current.storyState,\n      deletionState: current.deletionState,\n    },\n    location,\n    notes,\n  };\n}\n\nasync function applyMissionDeleteMutation"""
          text = apply_pattern.sub(lambda _: new_apply, text, count=1)
          path.write_text(text)

          # Recurring scoped saves must carry target-series metadata even for Entire series.
          for filename in [
              'apps/mobile/src/calendar/calendar-mission-adjustment-save.ts',
              'apps/mobile/src/calendar/calendar-mission-details-save.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace(
                  "...(targetSeries.id === sourceSeries.id ? {} : { series: targetSeries }),",
                  "...(recurring ? { series: targetSeries } : {}),",
              )
              text = text.replace(
                  "...(targetSeries.id === currentSeries.id ? {} : { series: targetSeries }),",
                  "...(recurring ? { series: targetSeries } : {}),",
              )
              path.write_text(text)
          PY

          pnpm exec prettier --write \
            packages/localization/src/catalogs.ts \
            packages/database/src/sync-store.ts \
            apps/mobile/src/calendar/calendar-recurring-scope-chooser.tsx \
            apps/mobile/src/calendar/calendar-mission-details.tsx \
            apps/mobile/src/calendar/calendar-mission-details-route.tsx \
            apps/mobile/src/calendar/calendar-mission-details-save.ts \
            apps/mobile/src/calendar/calendar-mission-adjustment-save.ts \
            apps/mobile/src/calendar/calendar-mission-delete.ts \
            --config packages/config/prettier.config.mjs

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --exit-code -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/localization/src/catalogs.ts \
            packages/database/src/sync-store.ts \
            apps/mobile/src/calendar/calendar-recurring-scope-chooser.tsx \
            apps/mobile/src/calendar/calendar-mission-details.tsx \
            apps/mobile/src/calendar/calendar-mission-details-route.tsx \
            apps/mobile/src/calendar/calendar-mission-details-save.ts \
            apps/mobile/src/calendar/calendar-mission-adjustment-save.ts \
            apps/mobile/src/calendar/calendar-mission-delete.ts \
            .github/workflows/ci.yml
          git commit -m 'feat: wire recurring scope flows end to end'
          git push origin HEAD:feat/mts-052-recurring-scope-flows
