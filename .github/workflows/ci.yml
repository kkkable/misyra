name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format MTS-057 files
        run: >-
          pnpm exec prettier
          apps/api/package.json
          apps/api/src/reward-locking.ts
          apps/api/src/reward-locking.test.ts
          packages/database/src/index.ts
          packages/database/src/reward-basis-repository.ts
          packages/database/src/reward-basis-repository.test.ts
          packages/database/src/reward-basis-schema.ts
          packages/domain/src/index.ts
          packages/domain/src/reward-locking.ts
          packages/domain/src/reward-locking.test.ts
          --write --config packages/config/prettier.config.mjs

      - name: Commit formatted files when changed
        run: |
          if git diff --quiet; then
            echo "Feature files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package.json apps/api/src/reward-locking.ts apps/api/src/reward-locking.test.ts packages/database/src/index.ts packages/database/src/reward-basis-repository.ts packages/database/src/reward-basis-repository.test.ts packages/database/src/reward-basis-schema.ts packages/domain/src/index.ts packages/domain/src/reward-locking.ts packages/domain/src/reward-locking.test.ts
          git commit -m "style(mts-057): format reward locking implementation"
          git push origin HEAD:${{ github.head_ref }}
