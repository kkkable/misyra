name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head for formatting
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply pinned Prettier to Settings route
        run: pnpm exec prettier --write apps/mobile/src/settings/settings-route.tsx --config packages/config/prettier.config.mjs

      - name: Commit formatted route to PR head
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- apps/mobile/src/settings/settings-route.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/src/settings/settings-route.tsx
            git commit -m "style: apply pinned formatter to notification settings"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
