name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTS004_INTEGRATION: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      CI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply remaining exact mobile Prettier corrections
        run: |
          pnpm exec prettier --write \
            apps/mobile/src/calendar/calendar-mission-form-sheet.tsx \
            apps/mobile/src/calendar/calendar-recurrence-editor.tsx \
            --config packages/config/prettier.config.mjs
          if git diff --quiet -- \
            apps/mobile/src/calendar/calendar-mission-form-sheet.tsx \
            apps/mobile/src/calendar/calendar-recurrence-editor.tsx; then
            echo "No formatter changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/mobile/src/calendar/calendar-mission-form-sheet.tsx \
              apps/mobile/src/calendar/calendar-recurrence-editor.tsx
            git commit -m "style(mobile): apply pinned prettier output"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Install Bicep compiler in runner only
        run: az bicep install

      - name: Start deterministic local dependencies
        run: docker compose --file compose.yaml up -d --wait postgres azurite

      - name: Prove failing-fixture gates reject bad inputs
        run: pnpm ci:fixtures

      - name: Check workspace formatting
        run: pnpm format

      - name: Check CI-owned formatting
        run: pnpm format:ci

      - name: Lint workspaces
        run: pnpm lint

      - name: Lint CI-owned scripts and tests
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit, integration, and mobile component tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Reject high and critical dependency findings
        run: pnpm audit --audit-level high

      - name: Scan tracked implementation and configuration for secrets
        run: pnpm ci:secrets

      - name: Verify localization completeness
        run: pnpm ci:localization

      - name: Verify privacy and logging boundaries
        run: pnpm ci:privacy

      - name: Compile Bicep and environment parameter shapes
        run: pnpm validate:infra

      - name: Verify contract compatibility boundary
        run: pnpm ci:contracts

      - name: Stop local dependencies
        if: always()
        run: docker compose --file compose.yaml down --volumes
