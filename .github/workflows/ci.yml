name: MTS-052 count split correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-count-split-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MTS-052 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-052-recurring-scope-flows
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply count-split wiring and restore standard CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('apps/mobile/src/calendar/calendar-mission-details-save.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "  planRecurringSeriesScope,\n  resolveRewardEligibilityAfterEdit,",
              "  planRecurringSeriesScope,\n  recurrenceForThisAndFutureSplit,\n  resolveRewardEligibilityAfterEdit,",
              'details count helper import',
          )
          text = replace_once(
              text,
              "      recurrence: currentSeries.recurrence,\n",
              "      recurrence: recurrenceForThisAndFutureSplit(\n        currentSeries,\n        cachedRows.map((cached) =>\n          createMissionOccurrence(JSON.parse(cached.payload_json) as MissionOccurrenceInput),\n        ),\n        edit.missionId,\n      ),\n",
              'details target recurrence',
          )
          path.write_text(text)

          path = Path('apps/mobile/src/calendar/calendar-recurring-scope-adjustment.test.mjs')
          text = path.read_text()
          text = replace_once(
              text,
              "const originalRecurrence = {\n  pattern: { type: 'daily', interval: 1 },\n  end: { type: 'never' },\n};",
              "const originalRecurrence = {\n  pattern: { type: 'daily', interval: 1 },\n  end: { type: 'count', occurrenceCount: 6 },\n};",
              'adjustment count fixture',
          )
          text = replace_once(
              text,
              "    expect(JSON.parse(targetSeries.payload_json)).toEqual({\n      id: targetSeriesId,\n      title: 'Daily review',\n      recurrence: originalRecurrence,\n    });",
              "    expect(JSON.parse(targetSeries.payload_json)).toEqual({\n      id: targetSeriesId,\n      title: 'Daily review',\n      recurrence: {\n        pattern: { type: 'daily', interval: 1 },\n        end: { type: 'count', occurrenceCount: 5 },\n      },\n    });",
              'adjustment target count assertion',
          )
          text = replace_once(
              text,
              "    expect(updates.every((mutation) => mutation.payload.series?.id === targetSeriesId)).toBe(true);",
              "    expect(updates.every((mutation) => mutation.payload.series?.id === targetSeriesId)).toBe(true);\n    expect(\n      updates.every(\n        (mutation) => mutation.payload.series?.recurrence?.end?.occurrenceCount === 5,\n      ),\n    ).toBe(true);",
              'adjustment queued count assertion',
          )
          path.write_text(text)
          PY

          pnpm exec prettier --write \
            packages/domain/src/recurring-scope-operations.ts \
            packages/domain/src/recurring-scope-split-count.test.ts \
            apps/mobile/src/calendar/calendar-mission-adjustment-save.ts \
            apps/mobile/src/calendar/calendar-mission-details-save.ts \
            apps/mobile/src/calendar/calendar-recurring-scope-adjustment.test.mjs \
            --config packages/config/prettier.config.mjs

          pnpm --filter @misyra/domain test -- recurring-scope-split-count.test.ts
          pnpm --filter @misyra/mobile test -- calendar-recurring-scope-adjustment.test.mjs

          git show origin/main:.github/workflows/ci.yml > /tmp/ci-main.yml
          cp /tmp/ci-main.yml .github/workflows/ci.yml
          cmp -s .github/workflows/ci.yml /tmp/ci-main.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ci.yml \
            packages/domain/src/recurring-scope-operations.ts \
            packages/domain/src/recurring-scope-split-count.test.ts \
            apps/mobile/src/calendar/calendar-mission-adjustment-save.ts \
            apps/mobile/src/calendar/calendar-mission-details-save.ts \
            apps/mobile/src/calendar/calendar-recurring-scope-adjustment.test.mjs
          git commit -m 'fix: preserve recurrence count across scoped split'
          git push origin HEAD:feat/mts-052-recurring-scope-flows
