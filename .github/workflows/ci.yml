name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTS004_INTEGRATION: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      CI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout feature branch for temporary formatting
        uses: actions/checkout@v4
        with:
          ref: feat/mts-043-mission-card-overlaps
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format only MTS-043 touched files and commit
        run: |
          pnpm exec prettier apps/mobile/src/calendar/calendar-day-screen.tsx apps/mobile/src/calendar/calendar-mission-layout.test.mjs --write --config packages/config/prettier.config.mjs
          if git diff --quiet -- apps/mobile/src/calendar/calendar-day-screen.tsx apps/mobile/src/calendar/calendar-mission-layout.test.mjs; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "Misyra Auto Development"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/calendar/calendar-day-screen.tsx apps/mobile/src/calendar/calendar-mission-layout.test.mjs
          git commit -m "style(mts-043): apply repository formatting"
          git push origin HEAD:feat/mts-043-mission-card-overlaps
