name: MTS-029 Green Helper

on:
  push:

permissions:
  contents: write

jobs:
  normalize-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact active MTS-029 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-029-local-repositories
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify expected GREEN head
        run: test "$(git rev-parse HEAD)" = "a8d024bde20d93457513c7d474162785f05a47ab"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Regenerate lockfile with pinned toolchain
        run: pnpm install --lockfile-only

      - name: Format only MTS-029 files
        run: >-
          pnpm exec prettier --write
          apps/mobile/package.json
          apps/mobile/src/storage/schema.ts
          apps/mobile/src/storage/local-repositories.ts
          apps/mobile/src/storage/query-hooks.ts
          apps/mobile/src/storage/local-repositories.test.mjs
          --config packages/config/prettier.config.mjs

      - name: Prove helper touched only intended files
        run: |
          git diff --name-only | tee /tmp/mts029-files.txt
          test -s /tmp/mts029-files.txt
          if grep -Ev '^(apps/mobile/package.json|apps/mobile/src/storage/schema.ts|apps/mobile/src/storage/local-repositories.ts|apps/mobile/src/storage/query-hooks.ts|apps/mobile/src/storage/local-repositories.test.mjs|pnpm-lock.yaml)$' /tmp/mts029-files.txt; then
            echo 'Unexpected helper mutation' >&2
            exit 1
          fi

      - name: Commit normalized GREEN files to active branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package.json apps/mobile/src/storage/schema.ts apps/mobile/src/storage/local-repositories.ts apps/mobile/src/storage/query-hooks.ts apps/mobile/src/storage/local-repositories.test.mjs pnpm-lock.yaml
          git commit -m 'chore(mts-029): normalize local repositories'
          git push origin HEAD:feat/mts-029-local-repositories
