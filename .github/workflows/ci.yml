name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mts053-schema-parity-helper:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/mts-053-app-time-zone-travel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-053-app-time-zone-travel
          fetch-depth: 0
          persist-credentials: true

      - name: Align Drizzle device time-zone schema and restore CI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('packages/database/src/schema.ts')
          text = path.read_text()
          old = "    notificationCapability: text('notification_capability').notNull(),\n    createdAt: createdAt(),"
          new = "    notificationCapability: text('notification_capability').notNull(),\n    timeZone: text('time_zone'),\n    createdAt: createdAt(),"
          if text.count(old) != 1:
              raise SystemExit(f'expected one devices schema insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          Path('packages/database/src/device-time-zone-schema-parity.test.ts').write_text("""import { getTableConfig } from 'drizzle-orm/pg-core';
          import { describe, expect, it } from 'vitest';

          import { devices } from './schema.js';

          describe('MTS-053 device time-zone schema parity', () => {
            it('declares the migrated devices.time_zone column in Drizzle', () => {
              const columnNames = getTableConfig(devices).columns.map((column) => column.name);
              expect(columnNames).toContain('time_zone');
            });
          });
          """)
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "misyra-ci-helper"
          git config user.email "misyra-ci-helper@users.noreply.github.com"
          git add .github/workflows/ci.yml packages/database/src/schema.ts packages/database/src/device-time-zone-schema-parity.test.ts
          git commit -m "fix: align MTS-053 device schema declaration"
          git push origin HEAD:feat/mts-053-app-time-zone-travel
