name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mts053-format-helper:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/mts-053-app-time-zone-travel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-053-app-time-zone-travel
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format MTS-053 files and restore CI
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/api/src/device-settings.ts \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-interactive-timeline.tsx \
            apps/mobile/src/calendar/calendar-route-screen.tsx \
            apps/mobile/src/calendar/calendar-travel-display.test.mjs \
            apps/mobile/src/calendar/calendar-travel-projection.ts \
            apps/mobile/src/localization/app-time-zone-runtime.ts \
            apps/mobile/src/sync/app-time-zone-notice.test.mjs \
            apps/mobile/src/sync/app-time-zone-notice.tsx \
            apps/mobile/src/sync/authenticated-sync-runtime.ts \
            apps/mobile/src/sync/authenticated-sync-time-zone.test.mjs \
            apps/mobile/src/sync/root-sync-runtime.ts \
            apps/mobile/src/sync/sync-runtime-gate.tsx \
            packages/contracts/src/v1/device-settings.ts \
            packages/database/src/device-settings-store.ts \
            packages/database/src/device-settings-time-zone.test.ts \
            packages/localization/src/app-time-zone-messages.ts \
            packages/localization/src/index.ts \
            --config packages/config/prettier.config.mjs
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "misyra-ci-helper"
          git config user.email "misyra-ci-helper@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/api/src/device-settings.ts apps/mobile/src/calendar apps/mobile/src/localization/app-time-zone-runtime.ts apps/mobile/src/sync packages/contracts/src/v1/device-settings.ts packages/database/src/device-settings-store.ts packages/database/src/device-settings-time-zone.test.ts packages/localization/src/app-time-zone-messages.ts packages/localization/src/index.ts
          git commit -m "chore: format MTS-053 implementation"
          git push origin HEAD:feat/mts-053-app-time-zone-travel
