name: MTS-053 specification alignment

on:
  push:
    branches:
      - docs/mts-053-zone-notice-alignment

permissions:
  contents: write

jobs:
  align-specification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authorized MTS-053 wording correction and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/specifications/implementation-tickets.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- [ ] Current app zone updates from device change without notice.': '- [ ] Current app zone updates from device change and shows a small notice without confirmation.',
              '- [ ] No-notice assertion.': '- [ ] Device-zone change notice assertion.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/specifications/implementation-tickets.md .github/workflows/ci.yml
          git commit -m 'docs: align MTS-053 zone-change notice behavior'
          git push origin HEAD:docs/mts-053-zone-notice-alignment
