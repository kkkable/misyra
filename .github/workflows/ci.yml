name: MTS-028 Green Helper

on:
  push:
    branches:
      - verify/mts-028-green-helper-20260904

permissions:
  contents: write

jobs:
  normalize-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact active MTS-028 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-028-mobile-sqlite-schema
          fetch-depth: 0
          persist-credentials: true

      - name: Verify expected GREEN head
        run: test "$(git rev-parse HEAD)" = "e9500051e84fd8b93a5c479e25ead5b65b62d4a1"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Regenerate lockfile with pinned toolchain
        run: pnpm install --no-frozen-lockfile

      - name: Format only MTS-028 implementation files
        run: pnpm exec prettier --write apps/mobile/src/storage/schema.ts apps/mobile/src/storage/database.ts --config packages/config/prettier.config.mjs

      - name: Prove helper touched only intended generated or MTS-028 files
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(pnpm-lock.yaml|apps/mobile/src/storage/schema.ts|apps/mobile/src/storage/database.ts)$' || true)"
          test -z "$unexpected"
          git diff --check

      - name: Commit normalized GREEN files to active branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/mobile/src/storage/schema.ts apps/mobile/src/storage/database.ts; then
            echo "No normalization change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/mobile/src/storage/schema.ts apps/mobile/src/storage/database.ts
          git commit -m "chore(mts-028): normalize SQLite implementation"
          git push origin HEAD:feat/mts-028-mobile-sqlite-schema
