name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature head for disposable lint correction
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply strict-lint corrections and commit exact output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('apps/mobile/src/calendar/calendar-day-screen.tsx')
          text = screen.read_text()
          text = text.replace("const locale = getLocales()[0]?.languageTag ?? 'en';", "const locale = getLocales()[0].languageTag;")
          text = text.replace("const regionalFirstWeekday = getCalendars()[0]?.firstWeekday;", "const regionalFirstWeekday = Number(getCalendars()[0].firstWeekday);")
          screen.write_text(text)

          shell = Path('apps/mobile/src/calendar/calendar-day-shell.ts')
          text = shell.read_text()
          text = text.replace(
              "export function resolveInitialCalendarDate(deepLinkDate: unknown, today: string): string {\n  const candidate = Array.isArray(deepLinkDate) ? deepLinkDate[0] : deepLinkDate;",
              "export function resolveInitialCalendarDate(\n  deepLinkDate: string | readonly string[] | undefined,\n  today: string,\n): string {\n  const candidate = typeof deepLinkDate === 'string' ? deepLinkDate : deepLinkDate?.[0];",
          )
          shell.write_text(text)

          test = Path('apps/mobile/src/calendar/calendar-day-shell.test.mjs')
          text = test.read_text()
          text = text.replace("const DAY = 24 * 60 * 60 * 1000;\n\nfunction iso(day) {\n  return new Date(Date.UTC(2026, 8, day, 12)).toISOString();\n}\n\n", "")
          test.write_text(text)
          PY

          pnpm exec eslint \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-shell.ts \
            apps/mobile/src/calendar/calendar-day-shell.test.mjs \
            --config packages/config/eslint.config.mjs \
            --fix
          pnpm exec prettier --write \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-shell.ts \
            apps/mobile/src/calendar/calendar-day-shell.test.mjs \
            --config packages/config/prettier.config.mjs
          pnpm exec eslint \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-shell.ts \
            apps/mobile/src/calendar/calendar-day-shell.test.mjs \
            --config packages/config/eslint.config.mjs
          git add \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-shell.ts \
            apps/mobile/src/calendar/calendar-day-shell.test.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(mts-040): satisfy strict mobile lint"
            git push origin HEAD:${{ github.head_ref }}
          fi
