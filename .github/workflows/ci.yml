name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTS004_INTEGRATION: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      CI_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Bicep compiler in runner only
        run: az bicep install

      - name: Start deterministic local dependencies
        run: docker compose --file compose.yaml up -d --wait postgres azurite

      - name: Prove failing-fixture gates reject bad inputs
        run: pnpm ci:fixtures

      - name: Generate exact mobile Prettier corrections
        run: |
          pnpm exec prettier --write \
            apps/mobile/src/calendar/calendar-mission-create.test.mjs \
            apps/mobile/src/calendar/calendar-mission-create.ts \
            apps/mobile/src/calendar/calendar-mission-details-save.test.mjs \
            apps/mobile/src/calendar/calendar-mission-details-save.ts \
            apps/mobile/src/calendar/calendar-mission-form-sheet.tsx \
            apps/mobile/src/calendar/calendar-recurrence-editor.tsx \
            apps/mobile/src/calendar/calendar-recurrence-materialization.test.mjs \
            apps/mobile/src/calendar/calendar-region-runtime.ts \
            apps/mobile/src/storage/schema-general-note.test.mjs \
            --config packages/config/prettier.config.mjs

      - name: Upload exact mobile Prettier corrections
        uses: actions/upload-artifact@v4
        with:
          name: pr94-mobile-prettier
          path: |
            apps/mobile/src/calendar/calendar-mission-create.test.mjs
            apps/mobile/src/calendar/calendar-mission-create.ts
            apps/mobile/src/calendar/calendar-mission-details-save.test.mjs
            apps/mobile/src/calendar/calendar-mission-details-save.ts
            apps/mobile/src/calendar/calendar-mission-form-sheet.tsx
            apps/mobile/src/calendar/calendar-recurrence-editor.tsx
            apps/mobile/src/calendar/calendar-recurrence-materialization.test.mjs
            apps/mobile/src/calendar/calendar-region-runtime.ts
            apps/mobile/src/storage/schema-general-note.test.mjs
          if-no-files-found: error
          retention-days: 1

      - name: Restore source after format export
        run: git checkout -- apps/mobile/src

      - name: Check workspace formatting
        run: pnpm format

      - name: Check CI-owned formatting
        run: pnpm format:ci

      - name: Lint workspaces
        run: pnpm lint

      - name: Lint CI-owned scripts and tests
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit, integration, and mobile component tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Reject high and critical dependency findings
        run: pnpm audit --audit-level high

      - name: Scan tracked implementation and configuration for secrets
        run: pnpm ci:secrets

      - name: Verify localization completeness
        run: pnpm ci:localization

      - name: Verify privacy and logging boundaries
        run: pnpm ci:privacy

      - name: Compile Bicep and environment parameter shapes
        run: pnpm validate:infra

      - name: Verify contract compatibility boundary
        run: pnpm ci:contracts

      - name: Stop local dependencies
        if: always()
        run: docker compose --file compose.yaml down --volumes
