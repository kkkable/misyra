name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature head for disposable type correction
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply strict TypeScript corrections and commit exact output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('apps/mobile/src/calendar/calendar-day-screen.tsx')
          text = screen.read_text()
          text = text.replace(
              "  const [year, month, day] = value.split('-').map(Number);\n  return { year, month, day };",
              "  const [yearText = '0', monthText = '0', dayText = '0'] = value.split('-');\n  return { year: Number(yearText), month: Number(monthText), day: Number(dayText) };",
          )
          text = text.replace(
              "      resolveCalendarLaunch({\n        selectedDate,\n        today,\n        currentMinute: minuteOfDay(now),\n        firstTimedMissionMinute,\n        preservedMinute,\n        returningFromBackground,\n      }),",
              "      resolveCalendarLaunch({\n        selectedDate,\n        today,\n        currentMinute: minuteOfDay(now),\n        ...(firstTimedMissionMinute === undefined ? {} : { firstTimedMissionMinute }),\n        ...(preservedMinute === undefined ? {} : { preservedMinute }),\n        returningFromBackground,\n      }),",
          )
          screen.write_text(text)

          shell = Path('apps/mobile/src/calendar/calendar-day-shell.ts')
          text = shell.read_text()
          text = text.replace(
              "  const firstVisible = buildSevenDayStrip(monthStartValue, firstWeekday)[0];\n  const start = parseLocalDate(firstVisible.date);",
              "  const [firstVisible] = buildSevenDayStrip(monthStartValue, firstWeekday);\n  if (firstVisible === undefined) throw new TypeError('Unable to build Calendar month grid.');\n  const start = parseLocalDate(firstVisible.date);",
          )
          shell.write_text(text)
          PY

          pnpm exec prettier --write \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-shell.ts \
            --config packages/config/prettier.config.mjs
          pnpm --filter @misyra/mobile lint
          pnpm --filter @misyra/mobile typecheck
          git add \
            apps/mobile/src/calendar/calendar-day-screen.tsx \
            apps/mobile/src/calendar/calendar-day-shell.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(mts-040): satisfy strict mobile types"
            git push origin HEAD:${{ github.head_ref }}
          fi
