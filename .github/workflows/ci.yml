name: MTS-027 Lockfile Helper

on:
  push:
    branches:
      - verify/mts-027-lockfile-20260904

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact active MTS-027 branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-027-api-bootstrap-error-mapping
          fetch-depth: 0

      - name: Verify expected implementation head
        run: test "$(git rev-parse HEAD)" = "c39c07f9c483791eda6ca2186e6498460b1cb71e"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit only the generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --exit-code && exit 0
          git commit -m "chore(mts-027): sync workspace lockfile"
          git push origin HEAD:feat/mts-027-api-bootstrap-error-mapping
