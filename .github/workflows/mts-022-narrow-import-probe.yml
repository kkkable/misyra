name: MTS-022 narrow Drizzle import probe

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-narrow-import-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install baseline
        run: pnpm install --frozen-lockfile
      - name: Install rc5 in runner only and narrow schema imports
        shell: bash
        run: |
          pnpm --filter @misyra/database add --save-exact --lockfile=false drizzle-orm@1.0.0-rc.5-169397b
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/schema.ts')
          text = path.read_text()
          old = """import { getTableName, sql } from 'drizzle-orm';
          import {
            bigint,
            bigserial,
            boolean,
            check,
            date,
            index,
            integer,
            jsonb,
            pgTable,
            smallint,
            text,
            timestamp,
            uniqueIndex,
            uuid,
          } from 'drizzle-orm/pg-core';
          """
          new = """import { sql } from 'drizzle-orm/sql';
          import { getTableName } from 'drizzle-orm/table';
          import { check } from 'drizzle-orm/pg-core/checks';
          import { bigint } from 'drizzle-orm/pg-core/columns/bigint';
          import { bigserial } from 'drizzle-orm/pg-core/columns/bigserial';
          import { boolean } from 'drizzle-orm/pg-core/columns/boolean';
          import { date } from 'drizzle-orm/pg-core/columns/date';
          import { integer } from 'drizzle-orm/pg-core/columns/integer';
          import { jsonb } from 'drizzle-orm/pg-core/columns/json';
          import { smallint } from 'drizzle-orm/pg-core/columns/smallint';
          import { text } from 'drizzle-orm/pg-core/columns/text';
          import { timestamp } from 'drizzle-orm/pg-core/columns/timestamp';
          import { uuid } from 'drizzle-orm/pg-core/columns/uuid';
          import { index, uniqueIndex } from 'drizzle-orm/pg-core/indexes';
          import { pgTable } from 'drizzle-orm/pg-core/table';
          """
          if old not in text:
              raise SystemExit('expected import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Typecheck database with repository TypeScript 6 strict config
        run: pnpm --filter @misyra/database typecheck
      - name: Self-delete probe
        if: always()
        run: |
          git checkout -- packages/database/package.json packages/database/src/schema.ts
          rm .github/workflows/mts-022-narrow-import-probe.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/mts-022-narrow-import-probe.yml
          git commit -m 'chore(database): remove narrow import probe'
          git push origin HEAD:feat/mts-022-postgres-schema
