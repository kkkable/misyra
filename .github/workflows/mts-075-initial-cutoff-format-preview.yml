name: MTS-075 Initial Cutoff Format Preview
on:
  push:
    branches:
      - verify/mts-075-initial-cutoff-format-20260914
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/mts-075-initial-cutoff-format-20260914
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Format guard
        run: pnpm exec prettier --write packages/database/src/google-calendar-initial-cutoff.test.ts --config packages/config/prettier.config.mjs
      - name: Commit exact formatter result
        run: |
          git config user.name "Misyra Verification"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/src/google-calendar-initial-cutoff.test.ts
          git diff --cached --quiet || git commit -m "chore(verify): format MTS-075 initial cutoff guard"
          git push
