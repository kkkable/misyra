name: MTS-022 persist Drizzle declaration patch

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-persist-drizzle-patch.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Resolve rc5 lockfile
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Create pnpm patch from validated four-line declaration correction
        shell: bash
        run: |
          rm -rf .pnpm-patch-drizzle
          pnpm patch drizzle-orm@1.0.0-rc.5-169397b --edit-dir .pnpm-patch-drizzle
          python - <<'PY'
          from pathlib import Path

          root = Path('.pnpm-patch-drizzle')
          replacements = {
              root / 'pg-core/policies.d.ts': (
                  'declare class PgPolicy implements PgPolicyConfig {',
                  'declare class PgPolicy {',
              ),
              root / 'pg-core/roles.d.ts': (
                  'declare class PgRole implements PgRoleConfig {',
                  'declare class PgRole {',
              ),
              root / 'cockroach-core/policies.d.ts': (
                  'declare class CockroachPolicy implements CockroachPolicyConfig {',
                  'declare class CockroachPolicy {',
              ),
              root / 'cockroach-core/roles.d.ts': (
                  'declare class CockroachRole implements CockroachRoleConfig {',
                  'declare class CockroachRole {',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected upstream declaration shape in {path}')
              path.write_text(text.replace(old, new))
          PY
          pnpm patch-commit .pnpm-patch-drizzle
          rm -rf .pnpm-patch-drizzle
      - name: Verify patched frozen install and strict database typecheck
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @misyra/database typecheck
      - name: Self-delete helper and commit durable dependency patch
        run: |
          rm .github/workflows/mts-022-persist-drizzle-patch.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json packages/database/package.json pnpm-lock.yaml patches .github/workflows/mts-022-persist-drizzle-patch.yml
          git diff --cached --check
          git commit -m 'fix(database): patch Drizzle strict declaration compatibility'
          git push origin HEAD:feat/mts-022-postgres-schema
