name: MTS-022 retry review correction helper

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-review-green-retry.yml

permissions:
  contents: write

jobs:
  repair-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - name: Remove unsupported SQL formatting and retrigger helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mts-022-review-green.yml')
          text = path.read_text()
          old = 'pnpm exec prettier --write packages/database/migrations/0000_core.sql packages/database/src/migrations.ts packages/database/src/schema.ts --config packages/config/prettier.config.mjs'
          new = 'pnpm exec prettier --write packages/database/src/migrations.ts packages/database/src/schema.ts --config packages/config/prettier.config.mjs'
          if text.count(old) != 1:
              raise SystemExit(f'expected one format command, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/mts-022-review-green-retry.yml
          git config user.name "Misyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/mts-022-review-green.yml .github/workflows/mts-022-review-green-retry.yml
          git commit -m "chore(database): correct review helper formatting step"
          git push origin HEAD:feat/mts-022-postgres-schema
