name: MTS-022 format review test

on:
  push:
    branches:
      - feat/mts-022-postgres-schema
    paths:
      - .github/workflows/mts-022-format-review-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mts-022-postgres-schema
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Format review test with pinned Prettier
        run: pnpm exec prettier --write packages/database/src/tombstone-constraints.review.test.ts --config packages/config/prettier.config.mjs
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/mts-022-format-review-test.yml
          git config user.name 'Misyra Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/database/src/tombstone-constraints.review.test.ts .github/workflows/mts-022-format-review-test.yml
          git diff --cached --check
          git commit -m 'style(database): format tombstone review test'
          git push origin HEAD:feat/mts-022-postgres-schema
